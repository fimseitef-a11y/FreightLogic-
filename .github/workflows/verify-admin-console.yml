name: Verify Admin Console

# Live authenticated proof of the deployed Admin Console (Issue #231): sign in,
# list, invite, re-invite and revoke, driven through the real console code in
# headless Chromium against the production Worker.
#
# No job holds ADMIN_TOKEN. The script seeds a Worker v23 certification
# credential (`flac_…`, stored only as a hash, 15-minute TTL) that is narrower
# than ADMIN_TOKEN — it can never mint a permanent driver token — plus one
# synthetic driver, and deletes every key it touched. Manual dispatch only;
# read-only repository permissions; it never deploys and never commits.
#
# /admin/* is rate limited to 20/hr per IP and this run spends at most 14, so do
# not dispatch it twice inside one clock hour.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 1902a1759e441be91057aefda6762cb8
  KV_NAMESPACE_ID: a80b7959b0fa401d87e55c0c62e828a8

jobs:
  admin-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Playwright + Chromium
        run: |
          npm install -g playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Symlink playwright into node_modules
        run: |
          mkdir -p node_modules
          ln -sfn "$(npm root -g)/playwright" node_modules/playwright

      - name: Require Worker v23 before spending the admin rate budget
        run: |
          v=$(curl -sS --max-time 15 https://freightlogic-backup.fimseitef.workers.dev/health | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{try{process.stdout.write(String(JSON.parse(s).version))}catch{}})')
          echo "Deployed Worker version: ${v:-unknown}"
          if [ -z "$v" ] || [ "$v" -lt 23 ]; then
            echo '::error::Worker v23 (certification credential) is not deployed; the proof is UNOBSERVED.'
            exit 2
          fi

      - name: Run the live Admin Console proof
        id: gate
        env:
          FL_CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FL_CF_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          FL_KV_NAMESPACE_ID: ${{ env.KV_NAMESPACE_ID }}
        run: |
          set +e
          node scripts/verify-live-admin-console.mjs 2>&1 | tee admin.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          {
            echo "## Admin Console live proof — exit $code"
            echo
            echo "- commit: \`$(git rev-parse HEAD)\`"
            echo
            echo '```'
            cat admin.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
