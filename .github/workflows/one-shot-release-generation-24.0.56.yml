name: One-shot release generation 24.0.56

on:
  push:
    branches:
      - agent/gpt/today-command-center-v2
    paths:
      - .github/workflows/one-shot-release-generation-24.0.56.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Advance governed release generation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          OLD = '24.0.55'
          NEW = '24.0.56'

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} exact marker(s), found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          def replace_generation(path):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(OLD)
              if count < 1:
                  raise SystemExit(f'{path}: no {OLD} generation markers found')
              p.write_text(text.replace(OLD, NEW), encoding='utf-8')

          replace_exact(
              'app.js',
              "const APP_VERSION = '24.0.55';",
              "const APP_VERSION = '24.0.56';",
          )

          for path in (
              'service-worker.js',
              'index.html',
              'sw-bridge.js',
              'manifest.json',
              'midwest-stack-authority.js',
              'midwest-stack-config.json',
              'scripts/verify-cloudflare-parity.mjs',
          ):
              replace_generation(path)

          replace_exact(
              'modern-shell.js',
              '/* FreightLogic v24.0.55 — modern five-surface navigation adapter',
              '/* FreightLogic v24.0.56 — modern five-surface navigation adapter',
          )
          PY

      - name: Verify diff hygiene
        run: git diff --check

      - name: Verify release markers without external dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          V = '24.0.56'
          app = Path('app.js').read_text(encoding='utf-8')
          sw = Path('service-worker.js').read_text(encoding='utf-8')
          index = Path('index.html').read_text(encoding='utf-8')
          bridge = Path('sw-bridge.js').read_text(encoding='utf-8')
          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          authority = Path('midwest-stack-authority.js').read_text(encoding='utf-8')
          config = json.loads(Path('midwest-stack-config.json').read_text(encoding='utf-8'))
          parity = Path('scripts/verify-cloudflare-parity.mjs').read_text(encoding='utf-8')
          shell = Path('modern-shell.js').read_text(encoding='utf-8')

          assert f"const APP_VERSION = '{V}';" in app
          assert f"const SW_VERSION = '{V}';" in sw
          assert all(x == V for x in re.findall(r'\?v=([0-9]+\.[0-9]+\.[0-9]+)', sw))
          assert all(x == V for x in re.findall(r'\?v=([0-9]+\.[0-9]+\.[0-9]+)', index))
          assert manifest['name'] == f'FreightLogic v{V}'
          assert f"const VERSION = '{V}';" in authority
          assert config['appTarget'] == f'FreightLogic v{V}'
          assert f'serviceWorkerVersion: "{V}"' in parity
          assert f'manifestName: "FreightLogic v{V}"' in parity
          assert f'overlayScript: "midwest-stack-authority.js?v={V}"' in parity
          assert f"modern-shell.js?v={V}" in bridge
          assert f"modern-shell.js?v={V}" in sw
          for path, text in (
              ('service-worker.js', sw),
              ('sw-bridge.js', bridge),
              ('midwest-stack-authority.js', authority),
              ('modern-shell.js', shell),
          ):
              assert V in text.splitlines()[0], f'{path} header is not at {V}'
          PY

      - name: Verify static Cloudflare parity
        run: node scripts/verify-cloudflare-parity.mjs --static-only

      - name: Verify Today command-center contract
        run: node scripts/test-today-command-center-v2.mjs

      - name: Commit governed bump and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-release-generation-24.0.56.yml
          git add app.js index.html service-worker.js sw-bridge.js manifest.json modern-shell.js midwest-stack-authority.js midwest-stack-config.json scripts/verify-cloudflare-parity.mjs
          git config user.name 'gpt-release-helper'
          git config user.email 'gpt-release-helper@users.noreply.github.com'
          git commit -m '[gpt] Advance Today release generation to 24.0.56' -m 'FL-Lock: today-command-center-v2/54c09d42-db16-4f40-855a-d95ace8417fd'
          git push origin HEAD:${GITHUB_REF_NAME}
