name: One-shot release generation 24.0.56

on:
  push:
    branches:
      - agent/gpt/today-command-center-v2
    paths:
      - .github/workflows/one-shot-release-generation-24.0.56.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Advance governed release generation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          OLD = '24.0.55'
          NEW = '24.0.56'

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} exact marker(s), found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          def replace_generation(path):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(OLD)
              if count < 1:
                  raise SystemExit(f'{path}: no {OLD} generation markers found')
              p.write_text(text.replace(OLD, NEW), encoding='utf-8')

          replace_exact(
              'app.js',
              "const APP_VERSION = '24.0.55';",
              "const APP_VERSION = '24.0.56';",
          )

          for path in (
              'service-worker.js',
              'index.html',
              'sw-bridge.js',
              'manifest.json',
              'midwest-stack-authority.js',
              'midwest-stack-config.json',
              'scripts/verify-cloudflare-parity.mjs',
          ):
              replace_generation(path)

          replace_exact(
              'modern-shell.js',
              '/* FreightLogic v24.0.55 — modern five-surface navigation adapter',
              '/* FreightLogic v24.0.56 — modern five-surface navigation adapter',
          )
          PY

      - name: Verify focused release and Today contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node tests/unit/cache-generation.spec.mjs
          node scripts/verify-cloudflare-parity.mjs --static-only
          node scripts/test-today-command-center-v2.mjs

      - name: Commit governed bump and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-release-generation-24.0.56.yml
          git add app.js index.html service-worker.js sw-bridge.js manifest.json modern-shell.js midwest-stack-authority.js midwest-stack-config.json scripts/verify-cloudflare-parity.mjs
          git config user.name 'gpt-release-helper'
          git config user.email 'gpt-release-helper@users.noreply.github.com'
          git commit -m '[gpt] Advance Today release generation to 24.0.56' -m 'FL-Lock: today-command-center-v2/54c09d42-db16-4f40-855a-d95ace8417fd'
          git push origin HEAD:${GITHUB_REF_NAME}
