name: Run ELI Ingestion Now

# Runs ELI's ingestion once, on demand. ELI has no public route by design, so
# its only trigger is its cron. This temporarily switches the Worker's cron to
# every minute through the Cloudflare schedules API, waits for a run, then
# restores the exact previous schedule and verifies it. Ingestion is
# idempotent and rate-limited to one real run per 30 minutes. AIAG-TASK-0038; operator-requested
# 2026-10-01 01:06 ET. Results are read from D1 separately.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Select RUN_NOW to trigger one ELI ingestion run'
        required: true
        type: choice
        default: CANCEL
        options:
          - CANCEL
          - RUN_NOW

permissions:
  contents: read

concurrency:
  group: eli-runtime-production
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 1902a1759e441be91057aefda6762cb8
  ELI_WORKER: freightlogic-eli-runtime-v1

jobs:
  run-now:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse unless explicitly confirmed on main
        if: ${{ github.event.inputs.confirm != 'RUN_NOW' || github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Select RUN_NOW and run from main. Nothing was changed."
          exit 1

      - name: Fail early if the token is missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set."
            exit 1
          fi

      - name: Preflight - ELI enabled and Airtable token attached
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$ELI_WORKER/settings" \
            > /tmp/settings.json
          node -e '
            const s = JSON.parse(require("fs").readFileSync("/tmp/settings.json","utf8"));
            if (!s.success) throw new Error("could not read ELI settings");
            const b = s.result?.bindings ?? [];
            const show = b.map((x) => x.name + ":" + x.type).sort().join(", ");
            console.log("ELI bindings (names and types only):", show);
            const fail = (m) => { console.log("::error::" + m); process.exit(1); };
            const enabled = b.find((x) => x.name === "ELI_ENABLED");
            if (!enabled || enabled.text !== "true") fail("ELI is not enabled; run Deploy ELI Runtime -> ENABLE first.");
            const token = b.find((x) => x.name === "AIRTABLE_TOKEN");
            if (!token) fail("AIRTABLE_TOKEN is not attached to " + process.env.ELI_WORKER + ". Add it in Cloudflare as type Secret (a Text variable is removed by the next deploy).");
            if (token.type !== "secret_text") fail("AIRTABLE_TOKEN is attached as " + token.type + ", not as a Secret. Re-add it with type Secret.");
            console.log("Preflight OK: ELI enabled; AIRTABLE_TOKEN attached as a secret.");
          '

      - name: Save the current schedule
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$ELI_WORKER/schedules" \
            > /tmp/schedules.json
          node -e '
            const s = JSON.parse(require("fs").readFileSync("/tmp/schedules.json","utf8"));
            const crons = (s.result?.schedules ?? []).map((x) => ({ cron: x.cron }));
            if (!s.success || crons.length === 0) throw new Error("could not read the existing ELI schedule");
            require("fs").writeFileSync("/tmp/restore.json", JSON.stringify(crons));
            console.log("saved schedule:", JSON.stringify(crons));
          '

      - name: Fire once (temporary every-minute schedule)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
            --data '[{"cron":"* * * * *"}]' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$ELI_WORKER/schedules" >/dev/null
          # Cloudflare documents up to ~15 minutes for a cron change to reach
          # the network. ELI's producer runs Airtable at most once per 30
          # minutes, so the extra minute-ticks cost no Airtable calls.
          echo "Temporary every-minute schedule set; waiting up to 16 minutes for it to take effect."
          sleep 960

      - name: Restore the saved schedule
        if: ${{ always() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          [ -s /tmp/restore.json ] || { echo "Nothing to restore (schedule was never changed)."; exit 0; }
          curl -fsS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
            --data @/tmp/restore.json \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$ELI_WORKER/schedules" >/dev/null
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$ELI_WORKER/schedules" \
            > /tmp/after.json
          node -e '
            const want = JSON.parse(require("fs").readFileSync("/tmp/restore.json","utf8")).map((x) => x.cron).sort();
            const s = JSON.parse(require("fs").readFileSync("/tmp/after.json","utf8"));
            const got = (s.result?.schedules ?? []).map((x) => x.cron).sort();
            if (JSON.stringify(want) !== JSON.stringify(got)) {
              console.log("::error::ELI schedule NOT restored: expected " + JSON.stringify(want) + " got " + JSON.stringify(got));
              process.exit(1);
            }
            console.log("ELI schedule restored:", JSON.stringify(got));
          '
