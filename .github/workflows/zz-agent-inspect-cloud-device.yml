name: One-shot inspect cloud device identity

on:
  push:
    branches:
      - agent/gpt/worker-same-ms-key-fix

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/gpt/worker-same-ms-key-fix
          fetch-depth: 0
      - name: Print bounded cloud/device source excerpts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s = Path('app.js').read_text(errors='replace').splitlines()
          needles = ['X-Device-Id','cloudPullBackup','cloudPushBackup','cloudPushDelta','deviceId','deviceID','device_id','backupDevice','fl_device','installId','install_id']
          hits=[]
          for i,line in enumerate(s):
            if any(n in line for n in needles): hits.append(i)
          # coalesce +/- 8-line windows, cap to relevant source only
          windows=[]
          for i in hits:
            a=max(0,i-8); b=min(len(s),i+9)
            if windows and a <= windows[-1][1]+1:
              windows[-1]=(windows[-1][0], max(windows[-1][1],b))
            else: windows.append((a,b))
          print('HITS', len(hits), 'WINDOWS', len(windows))
          for a,b in windows:
            print(f'--- app.js lines {a+1}-{b} ---')
            for j in range(a,b):
              # Source code only; redact any literal token-shaped values defensively.
              line=s[j].replace('flk_', 'flk_[REDACTED_PREFIX]_')
              print(f'{j+1}: {line}')
          PY
      - name: Remove inspector from branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/zz-agent-inspect-cloud-device.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[gpt] Remove one-shot cloud device inspector'
          git push origin HEAD:agent/gpt/worker-same-ms-key-fix
