name: Audit Legacy Driver Tokens

# Read-only. Answers whether any driver bearer token minted under Worker v7
# (stored in plaintext before v14) still authenticates, so a rotation happens
# only where a credential is PROVEN live. It lists and reads the production KV
# namespace and writes nothing. Output is counts and userIds only: never a
# `token:` key name (the name IS the credential), a record value, or a hash.
# CLEAN exit 0, FINDINGS exit 1, UNOBSERVED exit 2. Rotation stays an operator
# action in the Admin Console; this job never rotates or revokes anything.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 1902a1759e441be91057aefda6762cb8
  FL_KV_NAMESPACE_ID: a80b7959b0fa401d87e55c0c62e828a8

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Audit legacy tokens (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          node scripts/audit-legacy-tokens.mjs | tee audit.log
          code=${PIPESTATUS[0]}
          { echo '## Legacy driver-token audit'; echo; echo "SHA: \`$GITHUB_SHA\`"; echo; echo '```'; cat audit.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
