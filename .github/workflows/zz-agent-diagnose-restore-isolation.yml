name: One-shot diagnose restore isolation

on:
  push:
    branches:
      - agent/gpt/worker-same-ms-key-fix

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/gpt/worker-same-ms-key-fix
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm install -g playwright@1.62.1
          npx playwright install --with-deps chromium
          mkdir -p node_modules
          ln -sfn "$(npm root -g)/playwright" node_modules/playwright
      - name: Restore parity alone
        id: alone
        continue-on-error: true
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import { runSpec } from './tests/integration/backup-restore-parity.spec.mjs';
          import { stopServer } from './tests/lib/harness.mjs';
          const r = await runSpec();
          await stopServer();
          console.log(`DIAG_ALONE pass=${r.pass} fail=${r.fail}`);
          if (r.fail) process.exit(1);
          NODE
      - name: Worker race then restore parity in one process
        id: chained
        continue-on-error: true
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import { runSpec as runRace } from './tests/unit/worker-pointer-race.spec.mjs';
          import { runSpec as runRestore } from './tests/integration/backup-restore-parity.spec.mjs';
          import { stopServer } from './tests/lib/harness.mjs';
          const beforeDate = globalThis.Date;
          const r1 = await runRace();
          const afterRaceDate = globalThis.Date;
          console.log(`DIAG_RACE pass=${r1.pass} fail=${r1.fail} dateIdentityRestored=${beforeDate === afterRaceDate} now=${Date.now()}`);
          const r2 = await runRestore();
          await stopServer();
          console.log(`DIAG_CHAIN_RESTORE pass=${r2.pass} fail=${r2.fail} dateIdentityStill=${beforeDate === globalThis.Date}`);
          if (r1.fail || r2.fail) process.exit(1);
          NODE
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "alone=${{ steps.alone.outcome }} chained=${{ steps.chained.outcome }}"
      - name: Remove diagnostic workflow from branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/zz-agent-diagnose-restore-isolation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[gpt] Remove one-shot restore isolation diagnostic'
          git push origin HEAD:agent/gpt/worker-same-ms-key-fix
