name: Verify Live Parity

# Read-only live observation of the deployed release. Nothing here deploys,
# writes, or changes anything.
#
# WHY THIS EXISTS. The live half of scripts/verify-cloudflare-parity.mjs had
# been UNOBSERVED for the whole v24.0.x line because agent sandboxes could not
# reach the deployed workers.dev origins. GitHub-hosted runners have ordinary
# outbound access and already reach Cloudflare, so this job provides the missing
# observation from a network that can actually see production.
#
# TRIGGERS. Manual dispatch remains available for an operator re-check. In
# addition, a push to main that changes a release-bound runtime asset, the
# verifier/inventory, or this workflow runs the same READ-ONLY gate
# automatically. This closes the "workflow exists but nobody can press the
# button from the connected tooling" gap without creating any deploy or repair
# authority. It never runs from PRs, comments, schedules, or repository dispatch.
#
# WHAT IT IS NOT. `permissions: contents: read`, no secrets, no deploy and no
# repository write path. This is the unauthenticated app/static/Worker-health
# sweep. Authenticated /evaluate, /extract, backup/restore and token-rotation
# smokes are a separate gate that needs a dedicated non-published test identity.
# On FAILURE it stops and reports; it never repairs production.
#
# THREE OUTCOMES, NOT TWO. The verifier distinguishes:
#   PASS       exit 0  — live evidence observed, everything agreed
#   FAILURE    exit 1  — real evidence of a mismatch
#   UNOBSERVED exit 2  — origins unreachable; NO parity claim in either direction
# UNOBSERVED remains non-zero. A network that cannot see production must never
# be recorded as production being wrong or production being right.

on:
  workflow_dispatch:
    inputs:
      app_origin:
        description: 'App origin to verify (blank = the script default)'
        required: false
        default: ''
      worker_origin:
        description: 'Backup Worker origin to verify (blank = the script default)'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'admin-driver-ui.js'
      - 'midwest-stack-authority.js'
      - 'midwest-stack-config.json'
      - 'manifest.json'
      - 'service-worker.js'
      - 'sw-bridge.js'
      - 'modern-shell.js'
      - 'voice-load.js'
      - 'vendor/**'
      - 'icon*.png'
      - 'favicon*.png'
      - '.assetsignore'
      - 'scripts/verify-cloudflare-parity.mjs'
      - 'scripts/lib/deploy-assets.mjs'
      - '.github/workflows/verify-live-parity.yml'

permissions:
  contents: read

jobs:
  live-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Record the exact source being verified
        run: |
          echo "commit:  $(git rev-parse HEAD)"
          echo "ref:     ${{ github.ref }}"
          echo "event:   ${{ github.event_name }}"
          echo "app version markers under verification:"
          grep -m1 "APP_VERSION = " app.js
          grep -m1 "SW_VERSION = " service-worker.js
          grep -m1 -E 'workerVersion: "[0-9]+"' scripts/verify-cloudflare-parity.mjs
          grep -m1 '"name"' manifest.json

      - name: Run the live parity verifier
        id: parity
        # No npm dependencies — the verifier is plain Node 18+ with global fetch.
        # `set +e` so PASS/FAILURE/UNOBSERVED can be recorded before the job is
        # deliberately failed for either non-PASS outcome.
        env:
          # On a push event these input properties resolve to empty strings, so
          # the verifier uses its production defaults. On workflow_dispatch the
          # same bindings carry the optional operator overrides without putting
          # dispatch-controlled text directly into shell source.
          APP_ORIGIN: ${{ inputs.app_origin }}
          WORKER_ORIGIN: ${{ inputs.worker_origin }}
        run: |
          set +e
          ARGS=()
          [ -n "$APP_ORIGIN" ] && ARGS+=("$APP_ORIGIN")
          [ -n "$WORKER_ORIGIN" ] && ARGS+=("$WORKER_ORIGIN")
          node scripts/verify-cloudflare-parity.mjs "${ARGS[@]}" 2>&1 | tee parity.log
          CODE=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          case "$CODE" in
            0) echo "verdict=PASS" >> "$GITHUB_OUTPUT" ;;
            2) echo "verdict=UNOBSERVED" >> "$GITHUB_OUTPUT" ;;
            *) echo "verdict=FAILURE" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Summarize
        if: always()
        run: |
          {
            echo "## Live Cloudflare parity — ${{ steps.parity.outputs.verdict }}"
            echo
            echo "- commit: \`$(git rev-parse HEAD)\`"
            echo "- event: \`${{ github.event_name }}\`"
            echo "- verifier exit code: \`${{ steps.parity.outputs.exit_code }}\`"
            echo
            echo '```'
            cat parity.log 2>/dev/null || echo '(no verifier output was produced)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the job on FAILURE or UNOBSERVED
        if: steps.parity.outputs.verdict != 'PASS'
        run: |
          echo "::error::Live parity verdict: ${{ steps.parity.outputs.verdict }} (exit ${{ steps.parity.outputs.exit_code }})"
          if [ "${{ steps.parity.outputs.verdict }}" = "UNOBSERVED" ]; then
            echo "::error::The deployed origins were not reachable from this runner. This is NOT evidence that production is wrong — and it is not evidence that it is right. Nothing may be certified from this run."
          else
            echo "::error::Live evidence of a mismatch. Report the exact failing check above; do not deploy or auto-fix from this workflow."
          fi
          exit 1
