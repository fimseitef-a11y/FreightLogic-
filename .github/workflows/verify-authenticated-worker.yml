name: Verify Authenticated Worker

# One-time production certification for authenticated Worker contracts.
# Runs automatically only when this workflow file itself lands on main; it can
# also be re-run manually later. It never uses operator data or a real driver
# credential. The existing Cloudflare deployment token is used only to seed an
# expiring synthetic driver record in the production KV namespace, after which
# the committed authority and backup verifiers exercise the deployed Worker.
# Cleanup is best-effort on every exit and identity keys also carry a TTL.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-authenticated-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 1902a1759e441be91057aefda6762cb8
  KV_NAMESPACE_ID: a80b7959b0fa401d87e55c0c62e828a8
  WORKER_ORIGIN: https://freightlogic-backup.fimseitef.workers.dev

jobs:
  authenticated-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Seed expiring synthetic identity, verify, and clean up
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo '::error::CLOUDFLARE_API_TOKEN is unavailable; authenticated production checks are UNOBSERVED.'
            exit 2
          fi

          TOKEN="flk_$(openssl rand -hex 16)"
          USER_ID="u_$(openssl rand -hex 10)"
          TOKEN_HASH="$(printf '%s' "$TOKEN" | sha256sum | awk '{print $1}')"
          echo "::add-mask::$TOKEN"

          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$KV_NAMESPACE_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          encode_key() {
            node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$1"
          }

          delete_key() {
            local key="$1"
            local enc
            enc="$(encode_key "$key")"
            curl -fsS -X DELETE -H "$AUTH" "$API/values/$enc" >/dev/null 2>&1 || true
          }

          delete_prefix() {
            local prefix="$1"
            local response
            response="$(curl -fsS -G -H "$AUTH" --data-urlencode "prefix=$prefix" --data-urlencode 'limit=1000' "$API/keys" 2>/dev/null || true)"
            if [ -z "$response" ]; then return 0; fi
            while IFS= read -r key; do
              [ -n "$key" ] && delete_key "$key"
            done < <(printf '%s' "$response" | node -e '
              let s=""; process.stdin.on("data",d=>s+=d); process.stdin.on("end",()=>{
                try { const j=JSON.parse(s); for (const x of (j.result||[])) if (x && x.name) console.log(x.name); } catch {}
              });')
          }

          cleanup() {
            set +e
            delete_prefix "user:$USER_ID:"
            delete_prefix "rl:eval:$USER_ID:"
            delete_prefix "rl:backup:$USER_ID:"
            delete_prefix "rl:delta:$USER_ID:"
            delete_key "user:$USER_ID"
            delete_key "tokh:$TOKEN_HASH"
          }
          trap cleanup EXIT

          CREATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RECORD="$(node -e '
            const [userId, createdAt, tokenHash] = process.argv.slice(1);
            process.stdout.write(JSON.stringify({userId,name:"FreightLogic Certification",tokenHash,createdAt,active:true,backupCount:0}));
          ' "$USER_ID" "$CREATED_AT" "$TOKEN_HASH")"

          put_value() {
            local key="$1" value="$2" enc response
            enc="$(encode_key "$key")"
            response="$(curl -fsS -X PUT -H "$AUTH" -H 'Content-Type: text/plain' --data-binary "$value" \
              "$API/values/$enc?expiration_ttl=900")" || {
                echo '::error::Cloudflare credential cannot write the synthetic KV identity. Authenticated checks are UNOBSERVED.'
                exit 2
              }
            printf '%s' "$response" | node -e '
              let s=""; process.stdin.on("data",d=>s+=d); process.stdin.on("end",()=>{
                const j=JSON.parse(s); if (!j.success) process.exit(1);
              });' || {
                echo '::error::Cloudflare KV rejected the synthetic identity write.'
                exit 2
              }
          }

          put_value "tokh:$TOKEN_HASH" "$RECORD"
          put_value "user:$USER_ID" "$RECORD"

          # KV is eventually consistent. Wait for the deployed Worker to see the
          # synthetic identity rather than turning propagation delay into a fail.
          ready=0
          for attempt in $(seq 1 18); do
            code="$(curl -sS -o /tmp/fl-auth-ready.json -w '%{http_code}' --max-time 15 \
              -H "X-Backup-Token: $TOKEN" -H 'X-Device-Id: fl-cert-ready' "$WORKER_ORIGIN/status" || true)"
            if [ "$code" = '200' ] && node -e '
              const fs=require("fs"); try { const j=JSON.parse(fs.readFileSync("/tmp/fl-auth-ready.json","utf8")); process.exit(j.ok===true?0:1); } catch { process.exit(1); }
            '; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" != '1' ]; then
            echo '::error::Synthetic identity never became visible to the live Worker; authenticated checks are UNOBSERVED.'
            exit 2
          fi

          echo 'Synthetic identity is live; running free authority-boundary checks.'
          FL_BACKUP_TOKEN="$TOKEN" node scripts/verify-live-authority.mjs "$WORKER_ORIGIN"

          echo 'Running synthetic backup/delta/restore round trip.'
          FL_BACKUP_TOKEN="$TOKEN" node scripts/verify-live-backup.mjs "$WORKER_ORIGIN"

          echo 'AUTHENTICATED WORKER VERDICT: PASS'
