name: FreightLogic full repair artifact

on:
  push:
    branches:
      - agent/gpt/full-repair-takeover

permissions:
  contents: read

jobs:
  build-repair-artifact:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact repair staging branch
        uses: actions/checkout@v6
        with:
          ref: agent/gpt/full-repair-takeover
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Extract and apply prior exact repair payload locally
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/full-repair-once.yml > /tmp/original-full-repair.yml
          python - <<'PY'
          from pathlib import Path

          src = Path('/tmp/original-full-repair.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n\n      - name: Static syntax and release gates"
          start = src.find(start_marker)
          if start < 0:
              raise SystemExit('prior repair payload start marker not found')
          start += len(start_marker)
          end = src.find(end_marker, start)
          if end < 0:
              raise SystemExit('prior repair payload end marker not found')
          lines = src[start:end].splitlines()
          dedented = []
          for line in lines:
              if line.startswith('          '):
                  line = line[10:]
              dedented.append(line)
          Path('/tmp/full-repair.py').write_text('\n'.join(dedented) + '\n')
          PY
          python /tmp/full-repair.py

      - name: Static syntax and repair invariants
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check service-worker.js
          node --check admin-driver-ui.js
          node --check cloud-backup-worker.js
          node tests/unit/cache-generation.spec.mjs
          node tests/unit/worker-token-rotation.spec.mjs
          node scripts/verify-cloudflare-parity.mjs --static-only
          git diff --check
          test "$(git diff --name-only | wc -l)" -gt 0
          git diff --name-only

      - name: Upload patched source for normal reviewed PR
        uses: actions/upload-artifact@v4
        with:
          name: freightlogic-reviewed-full-repair
          if-no-files-found: error
          retention-days: 1
          path: |
            app.js
            admin-driver-ui.js
            cloud-backup-worker.js
            service-worker.js
            sw-bridge.js
            modern-shell.js
            index.html
            manifest.json
            voice-load.js
            midwest-stack-authority.js
            midwest-stack-config.json
            scripts/verify-cloudflare-parity.mjs
            tests/unit/cache-generation.spec.mjs
            tests/unit/worker-token-rotation.spec.mjs
            tests/integration/full-repair-regressions.spec.mjs
            tests/run-all.mjs
            CLAUDE.md
            FIELD_TEST_CHECKLIST.md
            docs/CLOUDFLARE_DEPLOYMENT_PARITY_CHECKLIST.md
