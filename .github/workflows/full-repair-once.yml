name: FreightLogic full repair artifact

on:
  push:
    branches:
      - agent/gpt/full-repair-takeover

permissions:
  contents: read

jobs:
  build-repair-artifact:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact repair staging branch
        uses: actions/checkout@v6
        with:
          ref: agent/gpt/full-repair-takeover
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Extract and apply prior exact repair payload locally
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 0a2ee08d6ae255715203b887ca739546fee8d004
          git show 0a2ee08d6ae255715203b887ca739546fee8d004:.github/workflows/full-repair-once.yml > /tmp/original-full-repair.yml
          python - <<'PY'
          from pathlib import Path

          src = Path('/tmp/original-full-repair.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n\n      - name: Static syntax and release gates"
          start = src.find(start_marker)
          if start < 0:
              raise SystemExit('prior repair payload start marker not found')
          start += len(start_marker)
          end = src.find(end_marker, start)
          if end < 0:
              raise SystemExit('prior repair payload end marker not found')
          lines = src[start:end].splitlines()
          dedented = [line[10:] if line.startswith('          ') else line for line in lines]
          patcher = '\n'.join(dedented) + '\n'

          start_tag = '# ── Service worker: safe shared filename + generation ──────────'
          end_tag = '# ── Admin module: one owner + feature parity + easy self-setup ──'
          a = patcher.find(start_tag)
          b = patcher.find(end_tag)
          if a < 0 or b < 0 or b <= a:
              raise SystemExit('service-worker patcher section markers missing')
          replacement = r'''# ── Service worker: safe shared filename + generation ──────────
          p='service-worker.js'; s=read(p)
          if "const SW_VERSION = '24.0.12';" not in s: raise SystemExit('unexpected SW_VERSION')
          s=s.replace('/* FreightLogic v24.0.12 — Browser Hardened Service Worker */', '/* FreightLogic v24.0.13 — Browser Hardened Service Worker */',1)
          s=s.replace("const SW_VERSION = '24.0.12';", "const SW_VERSION = '24.0.13';",1)
          s=s.replace('?v=24.0.12','?v=24.0.13')
          raw_header="'X-Filename': file.name"
          if raw_header not in s: raise SystemExit('raw share filename header marker missing')
          safe_lines="""            // Shared filenames are attacker-controlled input. Header values may not carry CR/LF
            // or other control bytes; bound the value as well so metadata cannot become a storage sink.
            const safeFilename = String(file.name || `shared-file-${i}`)
              .replace(/[\\u0000-\\u001F\\u007F]/g, '_').slice(0, 180) || `shared-file-${i}`;
"""
          content_line="            const contentType = ALLOWED_SHARE_TYPES.has(file.type) ? file.type : 'application/octet-stream';\n"
          if content_line not in s: raise SystemExit('share content-type marker missing')
          s=s.replace(content_line, content_line + safe_lines, 1)
          s=s.replace(raw_header, "'X-Filename': safeFilename",1)
          write(p,s)

'''
          patcher = patcher[:a] + replacement + patcher[b:]
          Path('/tmp/full-repair.py').write_text(patcher)
          PY
          python /tmp/full-repair.py

      - name: Static syntax and repair invariants
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check service-worker.js
          node --check admin-driver-ui.js
          node --check cloud-backup-worker.js
          node tests/unit/cache-generation.spec.mjs
          node tests/unit/worker-token-rotation.spec.mjs
          node tests/unit/release-generation-discipline.spec.mjs
          node scripts/verify-cloudflare-parity.mjs --static-only
          git diff --check
          test "$(git diff --name-only | wc -l)" -gt 0
          git diff --name-only

      - name: Upload patched source for normal reviewed PR
        uses: actions/upload-artifact@v4
        with:
          name: freightlogic-reviewed-full-repair
          if-no-files-found: error
          retention-days: 1
          path: |
            app.js
            admin-driver-ui.js
            cloud-backup-worker.js
            service-worker.js
            sw-bridge.js
            modern-shell.js
            index.html
            manifest.json
            voice-load.js
            midwest-stack-authority.js
            midwest-stack-config.json
            scripts/verify-cloudflare-parity.mjs
            tests/unit/cache-generation.spec.mjs
            tests/unit/worker-token-rotation.spec.mjs
            tests/integration/full-repair-regressions.spec.mjs
            tests/run-all.mjs
            CLAUDE.md
            FIELD_TEST_CHECKLIST.md
            docs/CLOUDFLARE_DEPLOYMENT_PARITY_CHECKLIST.md
