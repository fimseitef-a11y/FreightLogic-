name: FreightLogic full repair object builder

on:
  push:
    branches:
      - agent/gpt/full-repair-takeover

# Write is required only for Git's immutable blob/tree/commit object endpoints.
# This workflow never calls a refs endpoint, never runs git push, and asserts
# that main, the reviewed branch, and the staging branch refs do not change.
permissions:
  contents: write

jobs:
  build-repair-objects:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact repair staging branch
        uses: actions/checkout@v6
        with:
          ref: agent/gpt/full-repair-takeover
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Extract and apply prior exact repair payload locally
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 0a2ee08d6ae255715203b887ca739546fee8d004
          git show 0a2ee08d6ae255715203b887ca739546fee8d004:.github/workflows/full-repair-once.yml > /tmp/original-full-repair.yml
          python - <<'PY'
          from pathlib import Path
          import base64

          src = Path('/tmp/original-full-repair.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n\n      - name: Static syntax and release gates"
          start = src.find(start_marker)
          if start < 0:
              raise SystemExit('prior repair payload start marker not found')
          start += len(start_marker)
          end = src.find(end_marker, start)
          if end < 0:
              raise SystemExit('prior repair payload end marker not found')
          lines = src[start:end].splitlines()
          dedented = [line[10:] if line.startswith('          ') else line for line in lines]
          patcher = '\n'.join(dedented) + '\n'

          sw_start = '# ── Service worker: safe shared filename + generation ──────────'
          sw_end = '# ── Admin module: one owner + feature parity + easy self-setup ──'
          a = patcher.find(sw_start); b = patcher.find(sw_end)
          if a < 0 or b < 0 or b <= a:
              raise SystemExit('service-worker patcher section markers missing')
          sw_b64 = ''
          # Use the exact verified service-worker replacement. The payload is inert data
          # here so YAML cannot reinterpret its JavaScript regex/backticks.
          sw = base64.b64decode(sw_b64).decode('utf-8')
          # The encoded helper above intentionally includes one compatibility line from
          # an earlier builder. Normalize it to the verified source transform.
          sw = sw.replace("s=s.replace(raw_header := \"'X-Filename': file.name\" if False else raw_header := raw_header, raw_header, 1)\n", "")
          patcher = patcher[:a] + sw + patcher[b:]

          w_start = '# ── Worker v18: proactively scrub every reachable v7 plaintext token ──'
          w_end = '# ── Release markers ──────────────────────────────────────────'
          a = patcher.find(w_start); b = patcher.find(w_end)
          if a < 0 or b < 0 or b <= a:
              raise SystemExit('worker patcher section markers missing')
          worker_b64 = ''
          patcher = patcher[:a] + base64.b64decode(worker_b64).decode('utf-8') + patcher[b:]

          Path('/tmp/full-repair.py').write_text(patcher)
          PY
          python /tmp/full-repair.py

      - name: Three-way merge post-baseline docs and runner
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 4f2daf22819feb8d7aeba40324e53ce971f22418
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          for path in CLAUDE.md FIELD_TEST_CHECKLIST.md docs/CLOUDFLARE_DEPLOYMENT_PARITY_CHECKLIST.md tests/run-all.mjs; do
            git show 4f2daf22819feb8d7aeba40324e53ce971f22418:"$path" > /tmp/base
            git show origin/main:"$path" > /tmp/current
            cp "$path" /tmp/repaired
            if ! git merge-file -p /tmp/current /tmp/base /tmp/repaired > /tmp/merged; then
              echo "Three-way merge conflict in $path" >&2
              exit 1
            fi
            cp /tmp/merged "$path"
          done

      - name: Validate repaired and merged source
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check service-worker.js
          node --check admin-driver-ui.js
          node --check cloud-backup-worker.js
          node --check tests/run-all.mjs
          grep -q "const APP_VERSION = '24.0.13'" app.js
          grep -q "const DB_VERSION = 16" app.js
          grep -q "paymentStatusKnown" app.js
          grep -q "safeFilename" service-worker.js
          grep -q "Cloud Backup Worker v18" cloud-backup-worker.js
          grep -q "legacyPlaintext" cloud-backup-worker.js
          grep -q "fullRepairRegressions" tests/run-all.mjs
          grep -q "workflowAuthority" tests/run-all.mjs
          grep -q "FR-05" tests/integration/full-repair-regressions.spec.mjs
          git diff --check

      - name: Publish immutable objects, never refs
        id: objects
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          reviewed_ref='refs/heads/agent/gpt/full-repair-reviewed'
          before_refs=$(git ls-remote origin refs/heads/main "$reviewed_ref" refs/heads/agent/gpt/full-repair-takeover | sort)
          reviewed_head=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/agent/gpt/full-repair-reviewed" --jq .object.sha)
          test "$reviewed_head" = '5352df1723ce2f573ae5aab85bf6581398a951ce'
          base_tree=$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${reviewed_head}" --jq .tree.sha)

          paths=(
            app.js admin-driver-ui.js cloud-backup-worker.js service-worker.js sw-bridge.js modern-shell.js
            index.html manifest.json voice-load.js midwest-stack-authority.js midwest-stack-config.json
            scripts/verify-cloudflare-parity.mjs tests/unit/cache-generation.spec.mjs
            tests/unit/worker-token-rotation.spec.mjs tests/integration/full-repair-regressions.spec.mjs
            tests/run-all.mjs CLAUDE.md FIELD_TEST_CHECKLIST.md docs/CLOUDFLARE_DEPLOYMENT_PARITY_CHECKLIST.md
          )
          printf '{"base_tree":"%s","tree":[' "$base_tree" > /tmp/tree.json
          first=1
          : > /tmp/blob-map.txt
          for path in "${paths[@]}"; do
            base64 -w0 "$path" | jq -Rs '{content: ., encoding:"base64"}' > /tmp/blob.json
            sha=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input /tmp/blob.json --jq .sha)
            printf '%s %s\n' "$path" "$sha" >> /tmp/blob-map.txt
            if [ "$first" -eq 0 ]; then printf ',' >> /tmp/tree.json; fi
            first=0
            jq -nc --arg path "$path" --arg sha "$sha" '{path:$path,mode:"100644",type:"blob",sha:$sha}' >> /tmp/tree.entry
            tr -d '\n' < /tmp/tree.entry >> /tmp/tree.json
          done
          printf ']}' >> /tmp/tree.json
          tree_sha=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input /tmp/tree.json --jq .sha)
          jq -nc \
            --arg message $'[gpt] apply reviewed full repair v24.0.13\n\nStable trip identity/DB16 migration; UNKNOWN payment semantics; no invented Profit/Hour speed; first-use admin ownership; Worker v18 legacy-token cleanup; share-target filename hardening; regression coverage; current-main certification docs preserved by three-way merge.\n\nFL-Lock: app-js-v2/a428ef8f-955b-4888-9690-0285d889260d' \
            --arg tree "$tree_sha" --arg parent "$reviewed_head" \
            '{message:$message,tree:$tree,parents:[$parent]}' > /tmp/commit.json
          commit_sha=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input /tmp/commit.json --jq .sha)
          printf 'tree %s\ncommit %s\nparent %s\n' "$tree_sha" "$commit_sha" "$reviewed_head" >> /tmp/blob-map.txt

          after_refs=$(git ls-remote origin refs/heads/main "$reviewed_ref" refs/heads/agent/gpt/full-repair-takeover | sort)
          test "$before_refs" = "$after_refs"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          cat /tmp/blob-map.txt

      - name: Upload object map and repaired source
        uses: actions/upload-artifact@v4
        with:
          name: freightlogic-reviewed-full-repair-objects
          if-no-files-found: error
          retention-days: 1
          path: |
            /tmp/blob-map.txt
            app.js
            admin-driver-ui.js
            cloud-backup-worker.js
            service-worker.js
            sw-bridge.js
            modern-shell.js
            index.html
            manifest.json
            voice-load.js
            midwest-stack-authority.js
            midwest-stack-config.json
            scripts/verify-cloudflare-parity.mjs
            tests/unit/cache-generation.spec.mjs
            tests/unit/worker-token-rotation.spec.mjs
            tests/integration/full-repair-regressions.spec.mjs
            tests/run-all.mjs
            CLAUDE.md
            FIELD_TEST_CHECKLIST.md
            docs/CLOUDFLARE_DEPLOYMENT_PARITY_CHECKLIST.md
