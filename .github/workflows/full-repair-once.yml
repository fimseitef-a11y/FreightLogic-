name: FreightLogic v24.0.14 repair object builder

on:
  push:
    branches:
      - agent/gpt/full-repair-takeover

permissions:
  actions: read
  contents: write

jobs:
  build-repair-objects:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out clean post-PR-210 repair branch
        uses: actions/checkout@v6
        with:
          ref: agent/gpt/full-repair-v24.0.14
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Assert exact repair baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '63c2743700053d9794f45236b9b2d2e68c1e264a'
          test "$(git rev-parse origin/main)" = '801b2aa800fe7472fa9db867aba112a70ebdd016'

      - name: Prepare immutable reviewed inputs and apply repair locally
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/f4407b8ace9dc67906cf4448ffeef4e84ea11023" --jq .content | tr -d '\n' | base64 -d > /tmp/original-full-repair.yml
          git fetch --no-tags origin ee3e7bf97491f8309f18c3ff003ee4a612cf6727
          git show ee3e7bf97491f8309f18c3ff003ee4a612cf6727:tests/integration/full-repair-regressions.spec.mjs > /tmp/full-repair-regressions-fixed.mjs
          printf '%s' \
            '' \
            '' \
            '' \
            '' \
            '' | base64 -d > /tmp/patch-v24.0.14.py
          python -m py_compile /tmp/patch-v24.0.14.py
          python /tmp/patch-v24.0.14.py

      - name: Merge approved PR 206 CSS onto PR 210 baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin 4f2daf22819feb8d7aeba40324e53ce971f22418 40ee119ad3f8bc42e02c6e81ed4682bb6162f333
          git show 4f2daf22819feb8d7aeba40324e53ce971f22418:styles.css > /tmp/styles-base.css
          git show 40ee119ad3f8bc42e02c6e81ed4682bb6162f333:styles.css > /tmp/styles-gpt.css
          cp styles.css /tmp/styles-current.css
          if ! git merge-file -p /tmp/styles-current.css /tmp/styles-base.css /tmp/styles-gpt.css > /tmp/styles-merged.css; then
            echo 'Approved PR #206 CSS conflicts with the post-PR-210 baseline; refusing to guess.' >&2
            exit 1
          fi
          cp /tmp/styles-merged.css styles.css

      - name: Static repair invariants
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check service-worker.js
          node --check cloud-backup-worker.js
          node --check sw-bridge.js
          node --check modern-shell.js
          node --check voice-load.js
          node --check midwest-stack-authority.js
          node --check tests/run-all.mjs
          grep -q "const APP_VERSION = '24.0.14'" app.js
          grep -q "const DB_VERSION = 16" app.js
          grep -q 'paymentStatusKnown' app.js
          ! grep -q 'Math.round(totalMi / 50)' app.js
          grep -q "const SW_VERSION = '24.0.14'" service-worker.js
          grep -q 'safeFilename' service-worker.js
          ! grep -q "'X-Filename': file.name" service-worker.js
          grep -q 'Cloud Backup Worker v19' cloud-backup-worker.js
          grep -q "version: '19'" cloud-backup-worker.js
          grep -q 'POST /admin/invites' cloud-backup-worker.js
          grep -q 'POST /claim' cloud-backup-worker.js
          grep -q 'legacyPlaintext' cloud-backup-worker.js
          grep -q 'fullRepairRegressions' tests/run-all.mjs
          grep -q 'zeroTokenOnboarding' tests/run-all.mjs
          grep -q 'workerInviteClaim' tests/run-all.mjs
          grep -q 'FR-04' tests/integration/full-repair-regressions.spec.mjs
          node tests/unit/cache-generation.spec.mjs
          node tests/unit/worker-token-rotation.spec.mjs
          node scripts/verify-cloudflare-parity.mjs --static-only
          git diff --check

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install -g playwright@1.62.1
          npx playwright install --with-deps chromium
          mkdir -p node_modules
          ln -sfn "$(npm root -g)/playwright" node_modules/playwright

      - name: Full regression suite
        run: node tests/run-all.mjs

      - name: Publish immutable objects, never refs
        id: objects
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repair_ref='refs/heads/agent/gpt/full-repair-v24.0.14'
          before_refs=$(git ls-remote origin refs/heads/main "$repair_ref" refs/heads/agent/gpt/full-repair-takeover | sort)
          repair_head=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/agent/gpt/full-repair-v24.0.14" --jq .object.sha)
          test "$repair_head" = '63c2743700053d9794f45236b9b2d2e68c1e264a'
          base_tree=$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${repair_head}" --jq .tree.sha)

          paths=(
            app.js cloud-backup-worker.js service-worker.js sw-bridge.js modern-shell.js
            index.html manifest.json voice-load.js midwest-stack-authority.js midwest-stack-config.json
            scripts/verify-cloudflare-parity.mjs tests/unit/cache-generation.spec.mjs
            tests/unit/worker-token-rotation.spec.mjs tests/integration/full-repair-regressions.spec.mjs
            tests/run-all.mjs styles.css CLAUDE.md FIELD_TEST_CHECKLIST.md
            docs/CLOUDFLARE_DEPLOYMENT_PARITY_CHECKLIST.md docs/BACKUP_CONTRACT.md
          )
          printf '{"base_tree":"%s","tree":[' "$base_tree" > /tmp/tree.json
          first=1
          : > /tmp/blob-map.txt
          for path in "${paths[@]}"; do
            base64 -w0 "$path" | jq -Rs '{content: ., encoding:"base64"}' > /tmp/blob.json
            sha=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input /tmp/blob.json --jq .sha)
            printf '%s %s\n' "$path" "$sha" >> /tmp/blob-map.txt
            if [ "$first" -eq 0 ]; then printf ',' >> /tmp/tree.json; fi
            first=0
            jq -nc --arg path "$path" --arg sha "$sha" '{path:$path,mode:"100644",type:"blob",sha:$sha}' | tr -d '\n' >> /tmp/tree.json
          done
          printf ']}' >> /tmp/tree.json
          tree_sha=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input /tmp/tree.json --jq .sha)
          jq -nc \
            --arg message $'[gpt] apply post-210 full repair v24.0.14\n\nPreserve PR #210 zero-token onboarding while adding DB16 stable trip identity, UNKNOWN payment semantics, explicit-speed-only Profit/Hour, v24.0.14 share-target hardening, Worker v19 proactive legacy-token cleanup, regression coverage, and the approved PR #206 presentation delta. Physical iPhone A1-A11 and authentic M6 remain open certification gates.\n\nFL-Lock: app-js-v2/a428ef8f-955b-4888-9690-0285d889260d' \
            --arg tree "$tree_sha" --arg parent "$repair_head" \
            '{message:$message,tree:$tree,parents:[$parent]}' > /tmp/commit.json
          commit_sha=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input /tmp/commit.json --jq .sha)
          printf 'tree %s\ncommit %s\nparent %s\n' "$tree_sha" "$commit_sha" "$repair_head" >> /tmp/blob-map.txt

          after_refs=$(git ls-remote origin refs/heads/main "$repair_ref" refs/heads/agent/gpt/full-repair-takeover | sort)
          test "$before_refs" = "$after_refs"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          cat /tmp/blob-map.txt

      - name: Upload object map
        uses: actions/upload-artifact@v4
        with:
          name: freightlogic-v24.0.14-repair-objects
          if-no-files-found: error
          retention-days: 1
          path: /tmp/blob-map.txt
