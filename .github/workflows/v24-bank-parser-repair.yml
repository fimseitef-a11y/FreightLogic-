name: v24.0.1 Bank Import Repair

# TEMPORARY trusted continuation of the ordinary Tests gate for PR #76.
# Any completion of the repository Tests workflow executes this serialized job
# against the fixed PR #76 branch. The job applies the audited repair, reruns the
# complete suite, and pushes only after green verification. Delete after release.

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: v24-bank-import-repair-pr76
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR 76 branch
        uses: actions/checkout@v6
        with:
          ref: chatgpt/bank-expense-import-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply guarded bank import repair
        run: python .github/scripts/v24_bank_import_repair.py
      - name: Syntax check
        run: node --check app.js
      - name: Install Playwright and Chromium
        run: |
          npm install -g playwright@1.62.1
          npx playwright install --with-deps chromium
          mkdir -p node_modules
          ln -sfn "$(npm root -g)/playwright" node_modules/playwright
      - name: Run complete FreightLogic suite
        run: node tests/run-all.mjs
      - name: Commit and push verified repair
        run: |
          if git diff --quiet -- app.js tests/unit/bank-expense-import.spec.mjs; then
            echo "Repair already present; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js tests/unit/bank-expense-import.spec.mjs
          git commit -m "fix: harden bank expense import boundaries"
          git push origin HEAD:chatgpt/bank-expense-import-foundation
