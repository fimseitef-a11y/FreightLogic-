name: Pre-v24 Integrity Patch

on:
  push:
    branches: [chatgpt/pre-v24-integrity-gate]
    paths:
      - '.github/workflows/pre-v24-integrity-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/pre-v24-integrity-gate
          fetch-depth: 0

      - name: Apply guarded integrity changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          def section(text, start, end, label):
              a = text.find(start)
              if a < 0:
                  raise SystemExit(f'{label}: start marker not found')
              b = text.find(end, a + len(start))
              if b < 0:
                  raise SystemExit(f'{label}: end marker not found')
              return a, b, text[a:b]

          def replace_section(text, start, end, transform, label):
              a, b, s = section(text, start, end, label)
              ns = transform(s)
              if ns == s:
                  raise SystemExit(f'{label}: transform made no change')
              return text[:a] + ns + text[b:]

          # -----------------------------------------------------------------
          # app.js — align floors, add live-source health, broker integrity gate
          # -----------------------------------------------------------------
          app = read('app.js')
          app = replace_once(
              app,
              "  preferredFloorRPM: 1.40,\n  normalFloorRPM: 1.35,",
              "  // Pre-v24 integrity gate: one protective doctrine across decision surfaces.\n  preferredFloorRPM: 1.50,\n  normalFloorRPM: 1.40,",
              'app floor alignment'
          )

          live_health = r'''
// ════════════════════════════════════════════════════════════════
// v23.9.1 PRE-v24: Live-source health contract
// External feeds must never fail as an unexplained `null`. Each source records
// the last attempt/result for Diagnostics while preserving the existing return
// shapes so this correctness pass does not become a feature rewrite.
// ════════════════════════════════════════════════════════════════
const LIVE_SOURCE_STATUS = Object.freeze({
  OK: 'OK',
  STALE: 'STALE',
  UNCONFIGURED: 'UNCONFIGURED',
  AUTH_ERROR: 'AUTH_ERROR',
  HTTP_ERROR: 'HTTP_ERROR',
  TIMEOUT: 'TIMEOUT',
  NETWORK_ERROR: 'NETWORK_ERROR',
  PARSE_ERROR: 'PARSE_ERROR',
  OFFLINE: 'OFFLINE',
});
const LIVE_SOURCE_HEALTH = new Map();
try {
  const prior = JSON.parse(sessionStorage.getItem('fl_live_source_health') || '{}');
  for (const [k,v] of Object.entries(prior || {})) if (v && typeof v === 'object') LIVE_SOURCE_HEALTH.set(k, v);
} catch(e) {}
function _persistLiveSourceHealth(){
  try { sessionStorage.setItem('fl_live_source_health', JSON.stringify(Object.fromEntries(LIVE_SOURCE_HEALTH))); } catch(e) {}
}
function setLiveSourceHealth(source, status, detail={}){
  const now = Date.now();
  const prev = LIVE_SOURCE_HEALTH.get(source) || {};
  const next = {
    ...prev,
    source,
    status,
    lastAttempt: now,
    lastSuccess: status === LIVE_SOURCE_STATUS.OK ? (detail.lastSuccess || now) : (prev.lastSuccess || null),
    ...detail,
  };
  LIVE_SOURCE_HEALTH.set(source, next);
  _persistLiveSourceHealth();
  if (status !== LIVE_SOURCE_STATUS.OK && status !== LIVE_SOURCE_STATUS.UNCONFIGURED && status !== LIVE_SOURCE_STATUS.OFFLINE){
    console.warn(`[FL] ${source} source health: ${status}`, detail);
  }
  return next;
}
function getAllLiveSourceHealth(){ return Object.fromEntries(LIVE_SOURCE_HEALTH); }
function _liveSourceFailureStatus(err){
  const n = String(err?.name || '').toLowerCase();
  return (n.includes('timeout') || n === 'aborterror') ? LIVE_SOURCE_STATUS.TIMEOUT : LIVE_SOURCE_STATUS.NETWORK_ERROR;
}
if (typeof window !== 'undefined') window.flGetLiveSourceHealth = getAllLiveSourceHealth;

'''
          eia_marker = "// ════════════════════════════════════════════════════════════════\n// v23.8: EIA Midwest regular gasoline feed (requires free EIA key in settings)"
          if 'const LIVE_SOURCE_STATUS = Object.freeze({' in app:
              raise SystemExit('live-source health contract already present unexpectedly')
          app = replace_once(app, eia_marker, live_health + eia_marker, 'insert live-source health contract')

          def patch_eia(s):
              s = replace_once(s, "  if (!navigator.onLine) return null;", "  if (!navigator.onLine) { setLiveSourceHealth('EIA', LIVE_SOURCE_STATUS.OFFLINE); return null; }", 'EIA offline')
              s = replace_once(s, "  if (lastFetch && (Date.now() - lastFetch) < threeDaysMs) return null; // Skip if fetched recently", "  if (lastFetch && (Date.now() - lastFetch) < threeDaysMs) { setLiveSourceHealth('EIA', LIVE_SOURCE_STATUS.OK, { cached: true, lastSuccess: lastFetch }); return null; } // Skip if fetched recently", 'EIA cached')
              s = replace_once(s, "  if (!eiaKey) return null;", "  if (!eiaKey) { setLiveSourceHealth('EIA', LIVE_SOURCE_STATUS.UNCONFIGURED, { reason: 'missing API key' }); return null; }", 'EIA key')
              s = replace_once(s, "    if (!res.ok) return null;", "    if (!res.ok) { setLiveSourceHealth('EIA', (res.status === 401 || res.status === 403) ? LIVE_SOURCE_STATUS.AUTH_ERROR : LIVE_SOURCE_STATUS.HTTP_ERROR, { httpStatus: res.status }); return null; }", 'EIA primary HTTP')
              s = replace_once(s, "      if (!fallbackRes.ok) return null;", "      if (!fallbackRes.ok) { setLiveSourceHealth('EIA', (fallbackRes.status === 401 || fallbackRes.status === 403) ? LIVE_SOURCE_STATUS.AUTH_ERROR : LIVE_SOURCE_STATUS.HTTP_ERROR, { httpStatus: fallbackRes.status, fallback: true }); return null; }", 'EIA fallback HTTP')
              s = replace_once(s, "      if (!record || !record.value) return null;", "      if (!record || !record.value) { setLiveSourceHealth('EIA', LIVE_SOURCE_STATUS.PARSE_ERROR, { reason: 'no usable Midwest gasoline record' }); return null; }", 'EIA no record')
              s = replace_once(s, "    if (!(price > 0)) return null;", "    if (!(price > 0)) { setLiveSourceHealth('EIA', LIVE_SOURCE_STATUS.PARSE_ERROR, { reason: 'invalid price value' }); return null; }", 'EIA bad price')
              s = replace_once(s, "    return { price, period };", "    setLiveSourceHealth('EIA', LIVE_SOURCE_STATUS.OK, { sourceTimestamp: period, value: price });\n    return { price, period };", 'EIA success')
              s = replace_once(s, "  } catch(e){ console.warn('[FL] EIA fetch', e); return null; }", "  } catch(e){ setLiveSourceHealth('EIA', _liveSourceFailureStatus(e), { message: String(e?.message || e || '') }); console.warn('[FL] EIA fetch', e); return null; }", 'EIA catch')
              return s
          app = replace_section(app, 'async function fetchEIAGasPrice(){', '// ════════════════════════════════════════════════════════════════\n// v21 T4B: NWS Weather Alerts for Route', patch_eia, 'EIA function')

          def patch_nws(s):
              s = replace_once(s, "  if (!navigator.onLine) return [];", "  if (!navigator.onLine) { setLiveSourceHealth('NWS', LIVE_SOURCE_STATUS.OFFLINE); return []; }", 'NWS offline')
              s = replace_once(s, "    if (cached && (Date.now() - cached.ts) < 30 * 60 * 1000){ alerts.push(...cached.alerts); continue; }", "    if (cached && (Date.now() - cached.ts) < 30 * 60 * 1000){ setLiveSourceHealth('NWS', LIVE_SOURCE_STATUS.OK, { cached: true, lastSuccess: cached.ts }); alerts.push(...cached.alerts); continue; }", 'NWS cache')
              s = replace_once(s, "      if (!res.ok){ continue; }", "      if (!res.ok){ setLiveSourceHealth('NWS', (res.status === 401 || res.status === 403) ? LIVE_SOURCE_STATUS.AUTH_ERROR : LIVE_SOURCE_STATUS.HTTP_ERROR, { httpStatus: res.status, point: pt.label }); continue; }", 'NWS HTTP')
              s = replace_once(s, "      _nwsCache.set(cacheKey, { alerts: ptAlerts, ts: Date.now() });\n      alerts.push(...ptAlerts);", "      const nwsSuccessTs = Date.now();\n      _nwsCache.set(cacheKey, { alerts: ptAlerts, ts: nwsSuccessTs });\n      setLiveSourceHealth('NWS', LIVE_SOURCE_STATUS.OK, { point: pt.label, alertCount: ptAlerts.length, lastSuccess: nwsSuccessTs });\n      alerts.push(...ptAlerts);", 'NWS success')
              s = replace_once(s, "    } catch(e){ /* graceful fallback */ }", "    } catch(e){ setLiveSourceHealth('NWS', _liveSourceFailureStatus(e), { point: pt.label, message: String(e?.message || e || '') }); }", 'NWS catch')
              return s
          app = replace_section(app, 'async function checkRouteWeather(originCoords, destCoords){', '// ════════════════════════════════════════════════════════════════\n// v21 T4C: FMCSA Carrier/Broker Lookup', patch_nws, 'NWS function')

          def patch_fmcsa(s):
              s = replace_once(s, "  if (!dotNumber || !navigator.onLine) return null;", "  if (!dotNumber) return null;\n  if (!navigator.onLine) { setLiveSourceHealth('FMCSA', LIVE_SOURCE_STATUS.OFFLINE); return null; }", 'FMCSA offline')
              s = replace_once(s, "  if (cached && (Date.now() - cached.ts) < 24 * 60 * 60 * 1000) return cached.data;", "  if (cached && (Date.now() - cached.ts) < 24 * 60 * 60 * 1000) { setLiveSourceHealth('FMCSA', LIVE_SOURCE_STATUS.OK, { cached: true, lastSuccess: cached.ts }); return cached.data; }", 'FMCSA cache')
              s = replace_once(s, "    if (!apiKey) return null;", "    if (!apiKey) { setLiveSourceHealth('FMCSA', LIVE_SOURCE_STATUS.UNCONFIGURED, { reason: 'missing API key' }); return null; }", 'FMCSA key')
              s = replace_once(s, "    if (!res.ok) return null;", "    if (!res.ok) { setLiveSourceHealth('FMCSA', (res.status === 401 || res.status === 403) ? LIVE_SOURCE_STATUS.AUTH_ERROR : LIVE_SOURCE_STATUS.HTTP_ERROR, { httpStatus: res.status }); return null; }", 'FMCSA HTTP')
              s = replace_once(s, "    if (!c) return null;", "    if (!c) { setLiveSourceHealth('FMCSA', LIVE_SOURCE_STATUS.PARSE_ERROR, { reason: 'carrier payload missing' }); return null; }", 'FMCSA parse')
              s = replace_once(s, "    _fmcsaCache.set(dot, { data, ts: Date.now() });\n    return data;", "    const fmcsaSuccessTs = Date.now();\n    _fmcsaCache.set(dot, { data, ts: fmcsaSuccessTs });\n    setLiveSourceHealth('FMCSA', LIVE_SOURCE_STATUS.OK, { dot, lastSuccess: fmcsaSuccessTs });\n    return data;", 'FMCSA success')
              s = replace_once(s, "  } catch(e){ console.warn('[FL] FMCSA lookup', e); return null; }", "  } catch(e){ setLiveSourceHealth('FMCSA', _liveSourceFailureStatus(e), { message: String(e?.message || e || '') }); console.warn('[FL] FMCSA lookup', e); return null; }", 'FMCSA catch')
              return s
          app = replace_section(app, 'async function lookupFMCSA(dotNumber){', '// ════════════════════════════════════════════════════════════════\n// v21 T4D: Border Wait Time (CBP API)', patch_fmcsa, 'FMCSA function')

          def patch_cbp(s):
              s = replace_once(s, "  if (!navigator.onLine) return null;", "  if (!navigator.onLine) { setLiveSourceHealth('CBP', LIVE_SOURCE_STATUS.OFFLINE); return null; }", 'CBP offline')
              s = replace_once(s, "  if (cached && (Date.now() - cached.ts) < 30 * 60 * 1000) return cached.data;", "  if (cached && (Date.now() - cached.ts) < 30 * 60 * 1000) { setLiveSourceHealth('CBP', LIVE_SOURCE_STATUS.OK, { cached: true, lastSuccess: cached.ts }); return cached.data; }", 'CBP cache')
              s = replace_once(s, "    if (!res.ok) return null;", "    if (!res.ok) { setLiveSourceHealth('CBP', (res.status === 401 || res.status === 403) ? LIVE_SOURCE_STATUS.AUTH_ERROR : LIVE_SOURCE_STATUS.HTTP_ERROR, { httpStatus: res.status, port: portCode }); return null; }", 'CBP HTTP')
              s = replace_once(s, "    _cbpCache.set(String(portCode), { data, ts: Date.now() });\n    return data;", "    const cbpSuccessTs = Date.now();\n    _cbpCache.set(String(portCode), { data, ts: cbpSuccessTs });\n    setLiveSourceHealth('CBP', LIVE_SOURCE_STATUS.OK, { port: portCode, lastSuccess: cbpSuccessTs });\n    return data;", 'CBP success')
              s = replace_once(s, "  } catch(e){ console.warn('[FL] CBP border wait', e); return null; }", "  } catch(e){ setLiveSourceHealth('CBP', _liveSourceFailureStatus(e), { message: String(e?.message || e || '') }); console.warn('[FL] CBP border wait', e); return null; }", 'CBP catch')
              return s
          app = replace_section(app, 'async function fetchBorderWaitTime(gatewayId){', '// ════════════════════════════════════════════════════════════════', patch_cbp, 'CBP function')

          # Diagnostics visibility for live source health.
          app = replace_once(
              app,
              "    ${row('AI Endpoint',       'dxAi',      '...')}",
              "    ${row('Live Feed Health',  'dxFeeds',   'No calls this session')}\n    ${row('AI Endpoint',       'dxAi',      '...')}",
              'diagnostics live feed row'
          )
          live_diag = r'''    // Pre-v24 integrity gate: external-feed failures are no longer silent.
    const feedHealth = Object.values(getAllLiveSourceHealth());
    if (!feedHealth.length){
      set('dxFeeds', 'No calls this session', null);
    } else {
      const hardFailures = feedHealth.filter(x => ![LIVE_SOURCE_STATUS.OK, LIVE_SOURCE_STATUS.UNCONFIGURED, LIVE_SOURCE_STATUS.OFFLINE].includes(x.status));
      const soft = feedHealth.filter(x => [LIVE_SOURCE_STATUS.UNCONFIGURED, LIVE_SOURCE_STATUS.OFFLINE].includes(x.status));
      const summary = feedHealth.map(x => `${x.source}:${x.status}`).join(' · ');
      set('dxFeeds', summary, hardFailures.length ? false : (soft.length ? null : true));
    }

'''
          app = replace_once(app, "    // AI/Worker endpoint ping — X-09:", live_diag + "    // AI/Worker endpoint ping — X-09:", 'diagnostics feed health summary')

          broker_gate = r'''
// v23.9.1 PRE-v24: conservative bidHistory broker-integrity gate.
// Only explicit broker-labelled evidence may repair legacy rows. Never infer a
// broker from trip.customer: that field can represent carrier/company identity
// and would silently recreate the attribution bug this gate is meant to stop.
let _brokerIntegrityGatePromise = null;
async function auditBrokerHistoryIntegrity(){
  if (_brokerIntegrityGatePromise) return _brokerIntegrityGatePromise;
  _brokerIntegrityGatePromise = (async () => {
    const [bids, trips] = await Promise.all([dumpStore('bidHistory'), dumpStore('trips')]);
    const tripByOrder = new Map();
    for (const trip of trips || []){
      const k = String(trip?.orderNo || '').trim();
      if (k) tripByOrder.set(k, trip);
    }
    let normalized = 0, backfilled = 0, unresolved = 0;
    const pending = [];
    for (const rec of bids || []){
      if (!rec || typeof rec !== 'object') continue;
      const next = { ...rec };
      const rawBroker = clampStr(rec.broker || '', 80);
      const normalizedBroker = normBroker(rawBroker);
      const loadKey = clampStr(rec.loadId || rec.orderNo || '', 60);
      const matchedTrip = loadKey ? tripByOrder.get(loadKey) : null;
      const explicitDisplay = clampStr(rec.brokerDisplay || rec.brokerName || '', 80);
      const tripBroker = clampStr(matchedTrip?.broker || '', 80);
      const provenDisplay = explicitDisplay || tripBroker;
      let changed = false;

      if (normalizedBroker && rawBroker !== normalizedBroker){
        next.broker = normalizedBroker;
        if (!next.brokerDisplay) next.brokerDisplay = rawBroker;
        normalized++;
        changed = true;
      }

      if ((!normalizedBroker || rec.legacyUnkeyed === true) && provenDisplay){
        const provenKey = normBroker(provenDisplay);
        if (provenKey){
          next.broker = provenKey;
          next.brokerDisplay = provenDisplay;
          const origin = clampStr(rec.origin || matchedTrip?.origin || '', 80);
          const destination = clampStr(rec.destination || matchedTrip?.destination || '', 80);
          if (!next.lane && origin && destination) next.lane = normalizeLane(origin, destination);
          next.legacyUnkeyed = false;
          next.integrityBackfilledAt = Date.now();
          next.integrityBackfillSource = explicitDisplay ? 'explicit-broker-field' : 'matched-trip-broker-field';
          backfilled++;
          changed = true;
        }
      }

      if (!normBroker(next.broker || '') || next.legacyUnkeyed === true){
        unresolved++;
        if (next.legacyUnkeyed !== true){ next.legacyUnkeyed = true; changed = true; }
      }
      if (changed) pending.push(next);
    }

    if (pending.length){
      const { t, stores } = tx('bidHistory', 'readwrite');
      for (const rec of pending) stores.bidHistory.put(rec);
      await new Promise((resolve, reject) => {
        t.oncomplete = () => resolve();
        t.onerror = () => reject(t.error || new Error('Broker integrity transaction failed'));
        t.onabort = () => reject(t.error || new Error('Broker integrity transaction aborted'));
      });
    }
    const summary = { scanned: (bids || []).length, normalized, backfilled, unresolved, updated: pending.length, ts: Date.now() };
    try { sessionStorage.setItem('fl_broker_integrity_summary', JSON.stringify(summary)); } catch(e) {}
    if (unresolved) console.warn(`[FL] Broker integrity: ${unresolved} legacy row(s) remain unresolved; excluded from broker intelligence.`);
    return summary;
  })().catch(err => {
    _brokerIntegrityGatePromise = null;
    console.warn('[FL] Broker integrity gate failed', err);
    return { error: String(err?.message || err || 'unknown') };
  });
  return _brokerIntegrityGatePromise;
}

'''
          broker_marker = '// v24.0.0: Broker intelligence — unifies the three bidHistory record flavors'
          if 'async function auditBrokerHistoryIntegrity()' in app:
              raise SystemExit('broker integrity gate already present unexpectedly')
          app = replace_once(app, broker_marker, broker_gate + broker_marker, 'insert broker integrity gate')
          app = replace_once(
              app,
              "async function mwInit(){\n  if (mwBound) return;\n  mwBound = true;",
              "async function mwInit(){\n  if (mwBound) return;\n  mwBound = true;\n  auditBrokerHistoryIntegrity().catch(e => console.warn('[FL] broker integrity boot check', e));",
              'invoke broker integrity gate'
          )
          write('app.js', app)

          # -----------------------------------------------------------------
          # Midwest authority — make July static bands self-expire.
          # -----------------------------------------------------------------
          auth = read('midwest-stack-authority.js')
          freshness_helper = r'''

  // Pre-v24 integrity gate: static market overrides are evidence with an age,
  // not permanent truth. CURRENT <=14d, AGING <=30d, STALE >30d.
  const RATE_OVERRIDE_FRESHNESS = Object.freeze({ currentDays: 14, agingDays: 30 });
  function getRateOverrideFreshness(asOf = new Date()){
    const effectiveMs = Date.parse(RATE_OVERRIDE_2026_07.effectiveDate + 'T00:00:00Z');
    const asOfMs = asOf instanceof Date ? asOf.getTime() : Date.parse(String(asOf));
    const ageDays = Number.isFinite(effectiveMs) && Number.isFinite(asOfMs) ? Math.max(0, Math.floor((asOfMs - effectiveMs) / 86400000)) : Infinity;
    const status = ageDays <= RATE_OVERRIDE_FRESHNESS.currentDays ? 'CURRENT' : (ageDays <= RATE_OVERRIDE_FRESHNESS.agingDays ? 'AGING' : 'STALE');
    return { status, ageDays, effectiveDate: RATE_OVERRIDE_2026_07.effectiveDate };
  }
'''
          auth = replace_once(auth, "  function cleanText(value){", freshness_helper + "\n  function cleanText(value){", 'authority freshness helper')
          old_band_block = """    const realisticBand = band.realisticWin;\n    const compressedWinRpm = ((realisticBand[0] + realisticBand[1]) / 2) * regionOverlay.multiplier;\n    const baseFloor = mode.floor;\n    const baseTarget = mode.target;\n    let floorRpm = Math.max(CONFIG.hardStops.absoluteTrueRpmReject, baseFloor, realisticBand[0] * regionOverlay.multiplier);\n    let winRpm = Math.max(mode.preferred, compressedWinRpm);\n    let askRpm = Math.max(baseTarget, realisticBand[1] * regionOverlay.multiplier) + premium;"""
          new_band_block = """    const rateFreshness = getRateOverrideFreshness();\n    const realisticBand = band.realisticWin;\n    const overrideStale = rateFreshness.status === 'STALE';\n    const staleProtectiveGuard = overrideStale && mode.id !== 'DEAD_ZONE';\n    const compressedWinRpm = ((realisticBand[0] + realisticBand[1]) / 2) * regionOverlay.multiplier;\n    const baseFloor = mode.floor;\n    const baseTarget = mode.target;\n    const protective = CONFIG.modes.PROTECT_FLOOR;\n    let floorRpm = staleProtectiveGuard\n      ? Math.max(CONFIG.hardStops.absoluteTrueRpmReject, baseFloor, protective.floor)\n      : Math.max(CONFIG.hardStops.absoluteTrueRpmReject, baseFloor, realisticBand[0] * regionOverlay.multiplier);\n    let winRpm = staleProtectiveGuard\n      ? Math.max(mode.preferred, protective.preferred)\n      : Math.max(mode.preferred, compressedWinRpm);\n    let askRpm = (staleProtectiveGuard\n      ? Math.max(baseTarget, protective.target)\n      : Math.max(baseTarget, realisticBand[1] * regionOverlay.multiplier)) + premium;\n    if (rateFreshness.status === 'STALE') flags.push(`Rate override STALE (${rateFreshness.ageDays}d old) — static July bands cannot relax protective pricing; refresh market evidence.`);\n    else if (rateFreshness.status === 'AGING') flags.push(`Rate override AGING (${rateFreshness.ageDays}d old) — use as secondary evidence and verify current market.`);"""
          auth = replace_once(auth, old_band_block, new_band_block, 'authority stale-band guard')
          write('midwest-stack-authority.js', auth)

          # -----------------------------------------------------------------
          # Reproducible CI: pin Playwright and move Actions off Node20 runtimes.
          # -----------------------------------------------------------------
          wf = read('.github/workflows/tests.yml')
          wf = replace_once(wf, 'actions/checkout@v4', 'actions/checkout@v6', 'checkout action runtime')
          wf = replace_once(wf, 'actions/setup-node@v4', 'actions/setup-node@v6', 'setup-node action runtime')
          wf = replace_once(wf, 'npm install -g playwright@latest', 'npm install -g playwright@1.62.1', 'pin Playwright')
          write('.github/workflows/tests.yml', wf)

          test_readme = read('tests/README.md')
          if 'playwright@latest' in test_readme:
              test_readme = test_readme.replace('playwright@latest', 'playwright@1.62.1')
          write('tests/README.md', test_readme)

          # -----------------------------------------------------------------
          # New integrity tests + test runner registration.
          # -----------------------------------------------------------------
          integrity_spec = r'''// v23.9.1 pre-v24 integrity gate — static source contracts.
import { readFileSync } from 'node:fs';
import { fileURLToPath } from 'node:url';
import path from 'node:path';
import { createSuite, ok } from '../lib/harness.mjs';

const __dirname = path.dirname(fileURLToPath(import.meta.url));
const ROOT = path.resolve(__dirname, '../..');
const source = p => readFileSync(path.join(ROOT, p), 'utf8');
const { test, run } = createSuite('unit/pre-v24-integrity.spec.mjs');

test('[PRE24-01] normal/preferred RPM floors align with the protective doctrine', () => {
  const app = source('app.js');
  ok(/preferredFloorRPM:\s*1\.50/.test(app), 'preferred floor must be $1.50');
  ok(/normalFloorRPM:\s*1\.40/.test(app), 'normal floor must be $1.40');
  ok(!/normalFloorRPM:\s*1\.35/.test(app), 'the stale $1.35 normal-floor authority must be gone');
});

test('[PRE24-02] July static rate bands have an enforceable freshness guard', () => {
  const auth = source('midwest-stack-authority.js');
  ok(auth.includes('RATE_OVERRIDE_FRESHNESS'), 'freshness thresholds missing');
  ok(auth.includes("rateFreshness.status === 'STALE'"), 'STALE path missing');
  ok(auth.includes('staleProtectiveGuard'), 'stale bands must fall back to protective pricing');
  ok(auth.includes('mode.id !== \'DEAD_ZONE\''), 'explicit DZ gate must remain a separate survival exception');
});

test('[PRE24-03] live feeds publish health instead of silently collapsing to null', () => {
  const app = source('app.js');
  for (const name of ['EIA','NWS','FMCSA','CBP']) ok(app.includes(`setLiveSourceHealth('${name}'`), `${name} health instrumentation missing`);
  for (const status of ['UNCONFIGURED','AUTH_ERROR','HTTP_ERROR','TIMEOUT','PARSE_ERROR','OFFLINE']) ok(app.includes(status), `live-source status ${status} missing`);
  ok(app.includes("row('Live Feed Health'"), 'Diagnostics must surface live-feed health');
});

test('[PRE24-04] broker backfill only uses explicit broker-labelled evidence', () => {
  const app = source('app.js');
  const m = app.match(/async function auditBrokerHistoryIntegrity\(\)\{[\s\S]*?\n\}\n\n\/\/ v24\.0\.0: Broker intelligence/);
  ok(m, 'broker integrity gate not found');
  ok(m[0].includes('brokerDisplay'), 'explicit brokerDisplay evidence should be supported');
  ok(m[0].includes('matchedTrip?.broker'), 'explicit trip.broker evidence should be supported');
  ok(!m[0].includes('matchedTrip?.customer'), 'trip.customer is ambiguous and must never be used to infer broker identity');
