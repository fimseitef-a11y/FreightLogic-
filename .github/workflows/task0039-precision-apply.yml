name: Task0039 Precision Apply

on:
  push:
    branches: [agent/gpt/task0039-precision-ui]

permissions:
  contents: write

jobs:
  apply-precision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: agent/gpt/task0039-precision-ui

      - name: Apply Precision layer and governed release generation
        shell: bash
        env:
          PRECISION_CSS_B64:  
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path

          marker = '/* FREIGHTLOGIC PRECISION — 2026-10-01 */'
          css = Path('styles.css')
          current = css.read_text()
          if marker not in current:
              layer = base64.b64decode(os.environ['PRECISION_CSS_B64']).decode('utf-8')
              css.write_text(current.rstrip() + '\n' + layer.lstrip() + '\n')
              old, new = '24.0.56', '24.0.57'
              release_files = ['app.js','index.html','service-worker.js','sw-bridge.js','modern-shell.js','manifest.json']
              counts = {}
              for name in release_files:
                  p = Path(name)
                  data = p.read_text()
                  count = data.count(old)
                  if count < 1:
                      raise SystemExit(f'{name}: expected at least one {old} marker')
                  p.write_text(data.replace(old, new))
                  counts[name] = count
              print('release replacements', counts)
          else:
              print('Precision layer already present; idempotent no-op')
          PY
          node scripts/verify-release-generation.mjs

      - name: Commit governed visual release
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css app.js index.html service-worker.js sw-bridge.js modern-shell.js manifest.json
          git commit -m "[gpt] Apply FreightLogic Precision visual layer and app v24.0.57" -m "FL-Lock: task0039-release/d1d80a2c-5ec8-43a8-a054-6e17e9ecaa09"
          git push origin HEAD:agent/gpt/task0039-precision-ui
