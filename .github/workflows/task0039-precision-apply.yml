name: Task0039 Precision Apply

on:
  push:
    branches: [agent/gpt/task0039-precision-ui]

permissions:
  contents: write

jobs:
  apply-precision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: agent/gpt/task0039-precision-ui

      - name: Apply Precision layer and governed release generation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('styles.css')
          marker = '/* FREIGHTLOGIC PRECISION — 2026-10-01 */'
          text = css.read_text()
          if marker in text:
              print('Precision layer already present; idempotent no-op')
              raise SystemExit(0)

          precision = r'''

/* FREIGHTLOGIC PRECISION — 2026-10-01
   Final presentation normalization only. Freight/economic logic, routing,
   persistence and data authority remain unchanged. */
html:root {
  --bg: #090c0e;
  --surface-0: #0d1114;
  --surface-1: #12171b;
  --surface-2: #182027;
  --surface-3: #202a32;
  --border: rgba(223,232,238,.10);
  --border-subtle: rgba(223,232,238,.065);
  --border-focus: rgba(242,173,59,.68);
  --text: #f3f5f6;
  --text-secondary: #aeb8bf;
  --text-tertiary: #89969f;
  --accent: #f2ad3b;
  --accent-dark: #d89424;
  --accent-text: #f7bc60;
  --accent-muted: rgba(242,173,59,.12);
  --accent-border: rgba(242,173,59,.34);
  --good: #43cf82;
  --bad: #ff6b65;
  --warn: #f5bd58;
  --r: 16px;
  --r-sm: 12px;
  --shadow: 0 7px 22px rgba(0,0,0,.18);
  --shadow-lg: 0 14px 38px rgba(0,0,0,.24);
  color-scheme: dark;
}
html[data-theme="light"] {
  --bg: #f3f5f6;
  --surface-0: #f7f9fa;
  --surface-1: #ffffff;
  --surface-2: #f1f4f5;
  --surface-3: #e8edef;
  --border: rgba(34,49,59,.14);
  --border-subtle: rgba(34,49,59,.085);
  --border-focus: rgba(201,134,25,.58);
  --text: #182229;
  --text-secondary: #52616b;
  --text-tertiary: #71808a;
  --accent: #d99628;
  --accent-dark: #c98619;
  --accent-text: #8a5708;
  --accent-muted: rgba(201,134,25,.11);
  --accent-border: rgba(201,134,25,.30);
  --good: #167a4d;
  --bad: #bc3f3b;
  --warn: #9a6815;
  --shadow: 0 7px 20px rgba(31,43,50,.07);
  --shadow-lg: 0 14px 34px rgba(31,43,50,.11);
  color-scheme: light;
}
html body {
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.48;
}
body .app { max-width: 560px; padding-inline: 14px; }
body header#mainHeader {
  background: rgba(13,17,20,.96);
  border-bottom: 1px solid var(--border-subtle);
  box-shadow: 0 1px 0 rgba(255,255,255,.015);
  backdrop-filter: saturate(130%) blur(14px);
  -webkit-backdrop-filter: saturate(130%) blur(14px);
}
html[data-theme="light"] body header#mainHeader { background: rgba(255,255,255,.95); }
body #mainHeader .title strong { color: var(--text); font-size: 18px; font-weight: 760; letter-spacing: -.02em; }
body #mainHeader .title span { color: var(--text-tertiary); }
body :is(.card,.item,.intel-row) {
  border: 1px solid var(--border-subtle);
  background: var(--surface-1);
  box-shadow: var(--shadow);
}
body .card { border-radius: 16px; }
body .item, body .intel-row { border-radius: 14px; }
body #homeKPICard,
body #view-money > .card:first-child {
  background: var(--surface-1);
  border-color: var(--accent-border);
  box-shadow: 0 8px 26px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.025);
}
html[data-theme="light"] body #homeKPICard,
html[data-theme="light"] body #view-money > .card:first-child { box-shadow: 0 8px 24px rgba(31,43,50,.085); }
body .card h3 { color: var(--text-secondary); font-size: 12px; font-weight: 720; letter-spacing: .01em; text-transform: none; }
body :is(.kpi-hero-label,.kpi-cell-label,.item .k,.fl-nm-label) {
  color: var(--text-tertiary);
  font-size: 10px;
  letter-spacing: .015em;
  text-transform: none;
}
body .kpi-progress-bar {
  background: var(--accent);
  box-shadow: none;
  animation: none !important;
}
body :is(.tag,.fl-grade-chip,.fl-goal-badge) {
  min-height: 22px;
  padding: 4px 8px;
  border: 1px solid var(--border-subtle);
  border-radius: 999px;
  font-size: 10px;
  font-weight: 720;
  line-height: 1.2;
  letter-spacing: .01em;
  box-shadow: none;
}
body :is(.chip,.fl-intel-tab,.settings-collapse-btn) {
  border-color: var(--border-subtle);
  background: var(--surface-2);
  box-shadow: none;
}
body :is(.chip.active,.fl-intel-tab.active,[aria-selected="true"]) {
  border-color: var(--accent-border);
  background: var(--accent-muted);
  color: var(--accent-text);
  box-shadow: inset 0 0 0 1px rgba(242,173,59,.06);
}
body :is(.btn,.fl-quick-btn) {
  border-color: var(--border-subtle);
  background: var(--surface-2);
  box-shadow: 0 2px 7px rgba(0,0,0,.10);
}
body :is(.btn.primary,.fl-quick-btn.primary),
body :is(.btn.primary,.fl-quick-btn.primary):hover {
  border-color: var(--accent);
  background: var(--accent);
  color: #241806;
  box-shadow: 0 5px 14px rgba(0,0,0,.16);
}
body :is(input,select,textarea) {
  border-color: var(--border);
  background: var(--surface-2);
  color: var(--text);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.015);
}
body :is(input,select,textarea):focus {
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px var(--accent-muted);
}
body .empty-state {
  border-color: var(--border);
  background: rgba(255,255,255,.012);
  box-shadow: none;
}
html[data-theme="light"] body .empty-state { background: rgba(24,34,41,.018); }
body .modal {
  border-color: var(--border);
  border-radius: 20px 20px 0 0;
  background: var(--surface-1);
  box-shadow: var(--shadow-lg);
}
body .bottom {
  background: rgba(13,17,20,.97);
  border-top: 1px solid var(--border-subtle);
  box-shadow: 0 -7px 24px rgba(0,0,0,.14);
  backdrop-filter: saturate(130%) blur(16px);
  -webkit-backdrop-filter: saturate(130%) blur(16px);
}
html[data-theme="light"] body .bottom { background: rgba(255,255,255,.96); box-shadow: 0 -7px 22px rgba(31,43,50,.07); }
body .bottom .nav { height: 64px; }
body .bottom .nav a { color: var(--text-tertiary); gap: 3px; }
body .bottom .nav a .ni {
  width: 38px;
  height: 30px;
  border: 1px solid transparent;
  border-radius: 11px;
  transition: background-color .14s ease, border-color .14s ease, color .14s ease;
}
body .bottom .nav a .nl { font-size: 10px; font-weight: 680; letter-spacing: 0; }
body .bottom .nav a.active { color: var(--accent-text); }
body .bottom .nav a.active:not(.nav-eval-center) .ni {
  border-color: var(--accent-border);
  background: var(--accent-muted);
  color: var(--accent-text);
  box-shadow: inset 0 0 0 1px rgba(242,173,59,.04);
}
body .bottom .nav a.nav-eval-center { margin-top: -7px; }
body .bottom .nav a.nav-eval-center .ni {
  width: 52px;
  height: 52px;
  border: 0;
  border-radius: 16px;
  background: var(--accent);
  color: #241806;
  box-shadow: 0 7px 18px rgba(0,0,0,.20), 0 0 0 4px var(--surface-0);
}
body .bottom .nav a.nav-eval-center .nl { color: var(--accent-text); font-size: 10px; }
@media (max-width: 480px) {
  body .app { padding-inline: 12px; }
  body :is(input,select,textarea) { font-size: 16px !important; }
}
@media (prefers-reduced-motion: reduce) {
  body .kpi-progress-bar,
  body .bottom .nav a .ni,
  body .fab,
  body .skel { animation: none !important; transition: none !important; }
}
@media (forced-colors: active) {
  body :is(.card,.item,.btn,.chip,.fl-quick-btn,.bottom,.modal) { border: 1px solid CanvasText; box-shadow: none; }
  body .bottom .nav a.active:not(.nav-eval-center) .ni { background: Canvas; color: Highlight; outline: 2px solid Highlight; outline-offset: -2px; }
}
'''
          css.write_text(text.rstrip() + precision + '\n')

          old = '24.0.56'
          new = '24.0.57'
          release_files = ['app.js', 'index.html', 'service-worker.js', 'sw-bridge.js', 'modern-shell.js', 'manifest.json']
          counts = {}
          for name in release_files:
              path = Path(name)
              data = path.read_text()
              count = data.count(old)
              if count < 1:
                  raise SystemExit(f'{name}: expected at least one {old} release marker')
              path.write_text(data.replace(old, new))
              counts[name] = count

          if "const APP_VERSION = '24.0.57';" not in Path('app.js').read_text()[:12000]:
              raise SystemExit('app.js APP_VERSION did not advance to 24.0.57')
          sw = Path('service-worker.js').read_text()
          if "SW_VERSION = '24.0.57'" not in sw or "freightlogic-24.0.57" not in sw:
              raise SystemExit('service-worker.js generation markers are not aligned')
          print('Release marker replacements:', counts)
          PY

          node scripts/verify-release-generation.mjs

      - name: Commit governed visual release
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css app.js index.html service-worker.js sw-bridge.js modern-shell.js manifest.json
          git commit -m "[gpt] Apply FreightLogic Precision visual layer and app v24.0.57" -m "FL-Lock: task0039-release/d1d80a2c-5ec8-43a8-a054-6e17e9ecaa09"
          git push origin HEAD:agent/gpt/task0039-precision-ui
