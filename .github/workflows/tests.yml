name: Tests

# Full Playwright suite on every PR targeting main and every push to main.
# Completion certification additionally runs the read-only B5 rollback/fix-forward
# verifier. Full history is required so B5 can prove the frozen first-parent
# release candidate and classify known prior targets instead of guessing from a
# shallow checkout.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  playwright-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Playwright + Chromium
        run: |
          npm install -g playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Symlink playwright into node_modules
        run: |
          mkdir -p node_modules
          ln -sfn "$(npm root -g)/playwright" node_modules/playwright

      - name: Run full suite
        run: node tests/run-all.mjs

      - name: Verify rollback / fix-forward evidence
        run: node scripts/verify-rollback.mjs
