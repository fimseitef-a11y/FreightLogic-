name: Tests

# X-06 (v23.9 Phase 2): normal PR/push gate plus a TEMPORARY PR #78 comment
# command used only to verify and commit the v24.0.1 bank-import repair.
# Restore the standard workflow immediately after the repair lands.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  playwright-suite:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Playwright + Chromium
        run: |
          npm install -g playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Symlink playwright into node_modules
        run: |
          mkdir -p node_modules
          ln -sfn "$(npm root -g)/playwright" node_modules/playwright
      - name: Run full suite
        run: node tests/run-all.mjs

  bank-import-repair:
    if: github.event_name == 'issue_comment' && github.event.issue.number == 78 && github.event.comment.body == '/v24-bank-repair'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR 76 feature branch
        uses: actions/checkout@v6
        with:
          ref: chatgpt/bank-expense-import-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply guarded bank-import repair
        run: python .github/scripts/v24_bank_import_repair.py
      - name: Syntax-check repaired app
        run: node --check app.js
      - name: Install Playwright + Chromium
        run: |
          npm install -g playwright@1.62.1
          npx playwright install --with-deps chromium
          mkdir -p node_modules
          ln -sfn "$(npm root -g)/playwright" node_modules/playwright
      - name: Run complete suite on repaired source
        run: node tests/run-all.mjs
      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js tests/unit/bank-expense-import.spec.mjs
          git commit -m "fix: harden bank expense import boundaries"
          git push origin HEAD:chatgpt/bank-expense-import-foundation
