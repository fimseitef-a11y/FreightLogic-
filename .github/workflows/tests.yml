name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bank-release-parity:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chatgpt/bank-expense-import-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/bank-expense-import-foundation
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply guarded v24.0.1 parity patch
        shell: bash
        run: |
          python3 .github/bank-release-v24.0.1.py
          node --check app.js
          node --check midwest-stack-authority.js
          node --check sw-bridge.js
          node --check voice-load.js
          git diff --check

      - name: Restore canonical CI and commit release parity
        shell: bash
        run: |
          git show origin/main:.github/workflows/tests.yml > .github/workflows/tests.yml
          rm .github/bank-release-v24.0.1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: bump bank import foundation to v24.0.1"
          git push origin HEAD:chatgpt/bank-expense-import-foundation
