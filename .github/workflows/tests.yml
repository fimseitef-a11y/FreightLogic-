name: Tests

# TEMPORARY v24.0.1 repair gate. This exact file is mirrored on main and PR #76
# to avoid workflow-definition ambiguity. Restore the standard X-06 workflow
# immediately after the verified bank-import repair lands.

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  playwright-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v24.0.1 PR branch
        uses: actions/checkout@v6
        with:
          ref: chatgpt/bank-expense-import-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply guarded bank-import repair
        run: python .github/scripts/v24_bank_import_repair.py
      - name: Syntax-check repaired app
        run: node --check app.js
      - name: Install Playwright + Chromium
        run: |
          npm install -g playwright@1.62.1
          npx playwright install --with-deps chromium
          mkdir -p node_modules
          ln -sfn "$(npm root -g)/playwright" node_modules/playwright
      - name: Run complete FreightLogic suite
        run: node tests/run-all.mjs
      - name: Commit verified bank-import repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js tests/unit/bank-expense-import.spec.mjs
          git commit -m "fix: harden bank expense import boundaries"
          git push origin HEAD:chatgpt/bank-expense-import-foundation
