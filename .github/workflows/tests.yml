name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  playwright-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/v24-unified-decision-engine
          fetch-depth: 0

      - name: Apply guarded v24 worker authority cleanup
        shell: bash
        run: |
          python3 scripts/v24_phase_a_cleanup.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- cloud-backup-worker.js tests/unit/v24-unified-decision.spec.mjs scripts/v24_phase_a_cleanup.py
          git commit -m "fix: remove stale AI decision authority"
          git push origin HEAD:chatgpt/v24-unified-decision-engine

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Playwright + Chromium
        run: |
          npm install -g playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Symlink playwright into node_modules
        run: |
          mkdir -p node_modules
          ln -sfn "$(npm root -g)/playwright" node_modules/playwright

      - name: Run full suite
        run: node tests/run-all.mjs
