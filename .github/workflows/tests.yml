name: Tests

# X-06 (v23.9 Phase 2): run the full Playwright suite (tests/run-all.mjs) on
# every PR targeting main and on every push to main. The suite exits non-zero
# on any failure. Configure playwright-suite as a required status check in
# branch protection/rulesets when repository settings permit it.
#
# Pre-v24 integrity gate: keep the browser harness reproducible. Do not use a
# floating Playwright install here; browser/toolchain changes must be explicit.
#
# Completion gate B5 intentionally verifies named historical release commits.
# A shallow checkout makes those commits disappear and turns a valid rollback
# audit into `fatal: Needed a single revision`, so CI must retain full history.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  # Explicit and least-privilege: an absent block inherits the repository
  # default, which may be write. This job only checks out and runs Node.
  contents: read

jobs:
  playwright-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Playwright + Chromium
        run: |
          npm install -g playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Symlink playwright into node_modules
        # FreightLogic intentionally has no package.json/build system. Node's
        # ESM resolver will not use NODE_PATH, so mirror the documented local
        # test setup by symlinking the pinned global Playwright package.
        run: |
          mkdir -p node_modules
          ln -sfn "$(npm root -g)/playwright" node_modules/playwright

      - name: Run full suite
        run: node tests/run-all.mjs

      - name: Validate backup Worker configuration and binding types
        run: npx --yes wrangler@4 types /tmp/freightlogic-worker-env.d.ts --config scripts/wrangler.backup-worker.jsonc --env-interface CloudflareEnv

      - name: Enforce compressed asset regression budget
        run: node scripts/performance-budget.mjs

      - name: Lighthouse + bounded local load readiness
        run: |
          set -euo pipefail
          npm install -g lighthouse@13.5.0
          node scripts/perf-static-server.mjs > /tmp/freightlogic-perf-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:4173/index.html >/dev/null
          CHROME_PATH=$(node --input-type=module -e "import { chromium } from 'playwright'; console.log(chromium.executablePath())")
          for run in 1 2 3; do
            lighthouse http://127.0.0.1:4173/index.html               --chrome-path="$CHROME_PATH"               --chrome-flags="--headless=new --no-sandbox"               --only-categories=performance               --output=json               --output-path="/tmp/freightlogic-lighthouse-$run.json"               --quiet
          done
          node scripts/assert-lighthouse.mjs             /tmp/freightlogic-lighthouse-1.json             /tmp/freightlogic-lighthouse-2.json             /tmp/freightlogic-lighthouse-3.json
          node scripts/load-test.mjs             --origin=http://127.0.0.1:4173             --path=/index.html             --concurrency=20             --requests=500
