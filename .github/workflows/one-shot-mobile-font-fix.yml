name: One-shot mobile font repair

# Temporary, deterministic branch-maintenance helper. The GitHub connector can
# only replace an entire existing file; styles.css is large enough that doing a
# whole-file rewrite just to append one release invariant is needlessly risky.
# This job is scoped to the certification branch, appends one exact CSS rule,
# commits it, and deletes THIS workflow in that same commit.

on:
  push:
    branches:
      - chatgpt/v2409-final-certification

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/v2409-final-certification
          fetch-depth: 0

      - name: Apply exact mobile form-size invariant and self-remove
        run: |
          set -euo pipefail
          marker='FL-CERT-MOBILE-FORM-SIZE'
          if grep -q "$marker" styles.css; then
            echo 'Mobile form-size invariant already present.'
          else
            cat >> styles.css <<'CSS'
          
          /* FL-CERT-MOBILE-FORM-SIZE
             iOS Safari zooms focused form controls below 16 CSS px. Some runtime intake
             surfaces carry older inline 15px declarations, so the release invariant must
             win at mobile widths without changing desktop density. */
          @media (max-width: 480px) {
            input, select, textarea { font-size: 16px !important; }
          }
          CSS
          fi
          git rm .github/workflows/one-shot-mobile-font-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles.css
          git commit -m '[gpt] Enforce iPhone-safe mobile form size'
          git push origin HEAD:chatgpt/v2409-final-certification
