name: Performance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Compressed asset budget
        run: node scripts/performance-budget.mjs

      - name: Validate bounded load-test harness locally
        run: node scripts/load-test-worker.mjs --selfTest --requests=1000 --concurrency=50 --maxP95=750

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.15.x

      - name: Lighthouse healthcheck
        run: lhci healthcheck --fatal --config=scripts/lighthouserc.json

      - name: Collect Lighthouse desktop runs
        run: lhci collect --config=scripts/lighthouserc.json

      - name: Assert Lighthouse budgets
        run: lhci assert --config=scripts/lighthouserc.json

      - name: Preserve Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14
