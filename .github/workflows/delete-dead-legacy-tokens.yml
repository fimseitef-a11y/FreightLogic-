name: Delete Dead Legacy Tokens

# One-off, operator-approved cleanup (2026-09-24). Deletes the legacy plaintext
# `token:` index keys that the audit proved no longer authenticate. It re-checks
# every key first and deletes nothing if any is still live. It never pushes to
# this repository. After deleting it re-runs the read-only audit, which must
# report CLEAN, so the job's own log is the evidence.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Select DELETE to remove the dead legacy token: keys from production KV'
        required: true
        type: choice
        default: CANCEL
        options:
          - CANCEL
          - DELETE

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 1902a1759e441be91057aefda6762cb8
  FL_KV_NAMESPACE_ID: a80b7959b0fa401d87e55c0c62e828a8

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse unless explicitly confirmed
        if: ${{ github.event.inputs.confirm != 'DELETE' }}
        run: |
          echo "::error::Select DELETE in the confirmation control to run this. Nothing was deleted."
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Delete dead legacy token keys, then re-audit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FL_CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          set -o pipefail
          node scripts/delete-dead-legacy-tokens.mjs | tee delete.log
          node scripts/audit-legacy-tokens.mjs | tee audit.log
          code=${PIPESTATUS[0]}
          { echo '## Dead legacy token cleanup'; echo; echo "SHA: \`$GITHUB_SHA\`"; echo; echo '```'; cat delete.log audit.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
