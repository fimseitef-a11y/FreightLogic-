name: GPT Source Diagnostic

on:
  push:
    branches:
      - agent/gpt/final-source-integrity
    paths:
      - '.github/workflows/gpt-source-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print exact source contexts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('app.js').read_text(encoding='utf-8').splitlines()
          def show(lo, hi, title):
              print(f'\n=== {title} ===')
              for j in range(lo-1, min(hi, len(lines))):
                  print(f'{j+1:05d}: {lines[j]}')
          for lo,hi,title in [
              (450,480,'numeric helpers'),
              (3735,3780,'CSV trip import'),
              (10645,10705,'F23 intake writer'),
              (12120,12265,'trip wizard load/save'),
              (20380,20649,'test exposure tail'),
          ]:
              show(lo,hi,title)
          print('\n=== emptyMiles use sites by containing function ===')
          for i,line in enumerate(lines):
              if 'emptyMiles' not in line: continue
              fn='(top-level)'
              for j in range(i, max(-1,i-120), -1):
                  s=lines[j].strip()
                  if s.startswith('function ') or s.startswith('async function '):
                      fn=f'{j+1}:{s}'
                      break
              print(f'{i+1:05d} | {fn} | {line.strip()}')
          PY
