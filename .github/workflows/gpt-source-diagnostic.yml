name: GPT Source Diagnostic

on:
  push:
    branches:
      - agent/gpt/final-source-integrity
    paths:
      - '.github/workflows/gpt-source-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print exact analytics contexts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('app.js').read_text(encoding='utf-8').splitlines()
          def show(lo, hi, title):
              print(f'\n=== {title} ===')
              for j in range(lo-1, min(hi, len(lines))):
                  print(f'{j+1:05d}: {lines[j]}')
          for lo,hi,title in [
              (4025,4160,'KPI functions'),
              (4265,4375,'broker + lane stats'),
              (4635,4725,'score baselines + load score'),
              (6065,6160,'command center'),
              (6315,6380,'trend alerts'),
              (15610,15750,'broker intel + lane history writer'),
              (17210,17275,'lane RPM trend'),
              (18250,18345,'period data'),
          ]:
              show(lo,hi,title)
          PY
