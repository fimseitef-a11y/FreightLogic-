name: GPT Final Source Integrity Patch
on:
  push:
    branches: [agent/gpt/final-source-integrity]
    paths: ['.github/workflows/gpt-source-diagnostic.yml']
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gpt/final-source-integrity
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply bounded repair
        run: python3 scripts/.gpt-final-source-patch.py
      - name: Install Playwright and Chromium
        run: |
          npm install -g playwright@1.62.1
          npx playwright install --with-deps chromium
          mkdir -p node_modules
          ln -sfn "$(npm root -g)/playwright" node_modules/playwright
      - name: Run full suite
        run: node tests/run-all.mjs
      - name: Run static deploy parity
        run: node scripts/verify-cloudflare-parity.mjs --static-only
      - name: Commit tested repair
        run: |
          git config user.name "FreightLogic GPT"
          git config user.email "actions@users.noreply.github.com"
          git add app.js tests/integration/v2404-fail-closed.spec.mjs service-worker.js index.html manifest.json sw-bridge.js voice-load.js scripts/verify-cloudflare-parity.mjs midwest-stack-authority.js midwest-stack-config.json CLAUDE.md
          git commit -m "[gpt] finalize v24.0.5 source integrity" -m "FL-Lock: app-js/6d3a9fd1-2c42-4ef4-91d4-f9c3f0a24b11"
          git push origin HEAD:agent/gpt/final-source-integrity
