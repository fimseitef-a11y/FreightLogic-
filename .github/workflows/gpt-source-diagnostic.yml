name: GPT Source Diagnostic

on:
  push:
    branches:
      - agent/gpt/final-source-integrity
    paths:
      - '.github/workflows/gpt-source-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print exact source contexts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('app.js').read_text(encoding='utf-8').splitlines()
          def show(lo, hi, title):
              print(f'\n=== {title} ===')
              for j in range(lo-1, min(hi, len(lines))):
                  print(f'{j+1:05d}: {lines[j]}')
          show(2680, 2785, 'trip template + sanitizeTrip')
          for needle in ['function posNum', 'function knownNum', 'emptyMiles', "'chicago':", 'tier1:']:
              hits=[i for i,l in enumerate(lines) if needle in l]
              print(f'\n=== {needle!r}: {len(hits)} hits ===')
              for i in hits[:30]:
                  print(f'{i+1:05d}: {lines[i]}')
          p=Path('tests/integration/v2404-fail-closed.spec.mjs')
          if p.exists():
              t=p.read_text(encoding='utf-8').splitlines()
              print(f'\n=== {p} lines={len(t)} ===')
              for i,line in enumerate(t,1):
                  print(f'{i:04d}: {line}')
          print('\n=== tests/run-all.mjs relevant tail ===')
          r=Path('tests/run-all.mjs').read_text(encoding='utf-8').splitlines()
          for i,line in enumerate(r,1):
              if 'v2404' in line.lower() or 'spec.mjs' in line:
                  print(f'{i:04d}: {line}')
          PY
