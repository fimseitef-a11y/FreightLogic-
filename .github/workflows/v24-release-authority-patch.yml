name: v24 release authority correction

on:
  push:
    branches: [chatgpt/v24-unified-decision-engine]
    paths:
      - '.github/workflows/v24-release-authority-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/v24-unified-decision-engine
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply guarded v24 release corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one guarded match, found {count}')
              write(path, text.replace(old, new, 1))

          # -----------------------------------------------------------------
          # app.js — close remaining v24 authority gaps.
          # -----------------------------------------------------------------
          replace_once('app.js',
          """function deriveUnifiedBid(totalMiles, opts={}){\n  const miles = Math.max(0, Number(totalMiles || 0));\n  const urgencyBoost = Number(opts.urgencyBoost || 0);\n  const crossBorder = !!opts.crossBorder;\n  const rawRange = generateBidRange(miles, { urgencyBoost, crossBorder });""",
          """function deriveUnifiedBid(totalMiles, opts={}){\n  const miles = Math.max(0, Number(totalMiles || 0));\n  const rawUrgencyBoost = Number(opts.urgencyBoost || 0);\n  const urgencyBoost = Number.isFinite(rawUrgencyBoost) ? Math.max(0, Math.min(0.30, rawUrgencyBoost)) : 0;\n  const crossBorder = !!opts.crossBorder;\n  const rawRange = generateBidRange(miles, { urgencyBoost, crossBorder });""")
          replace_once('app.js',
          """    urgencyBoost: Math.min(0.30, urgencyBoost),\n    crossBorder,""",
          """    urgencyBoost,\n    crossBorder,""")

          replace_once('app.js',
          """    economics: {\n      trueRPM: decision.economics.trueRPM,\n      loadedRPM: decision.economics.loadedRPM,\n      totalMi: decision.economics.totalMi,\n      deadMi: decision.economics.deadMi,\n      profitMarginPct: decision.economics.profitMarginPct,\n      breakEvenRPM: decision.economics.breakEvenRPM,\n    },\n    route: decision.route,""",
          """    economics: {\n      trueRPM: decision.economics.trueRPM,\n      loadedRPM: decision.economics.loadedRPM,\n      totalMi: decision.economics.totalMi,\n      deadMi: decision.economics.deadMi,\n      profitMarginPct: decision.economics.profitMarginPct,\n      breakEvenRPM: decision.economics.breakEvenRPM,\n    },\n    bid: {\n      authority: decision.bid.authority,\n      basis: decision.bid.basis,\n      range: decision.bid.range,\n    },\n    route: decision.route,""")

          app = read('app.js')
          app = app.replace('🤖 Ask AI — Strategic Analysis', '🤖 Ask AI — Review Decision')
          old = "const evVerdictColor = ev.verdict === 'ACCEPT' ? 'var(--good)' : ev.verdict === 'NEGOTIATE' ? 'var(--warn)' : ev.verdict === 'STRATEGIC_ONLY' ? '#58a6ff' : 'var(--bad)';"
          new = "const evVerdictColor = ev.verdict === 'ACCEPT' ? 'var(--good)' : (ev.verdict === 'STRATEGIC' || ev.verdict === 'DZ-EXIT') ? 'var(--warn)' : 'var(--bad)';"
          if app.count(old) != 1:
              raise SystemExit(f'app.js: verdict-color guarded match count {app.count(old)}')
          app = app.replace(old, new, 1)
          app = app.replace('AI STRATEGIC ANALYSIS', 'AI REVIEW · CANONICAL DECISION LOCKED')
          app = app.replace('>AI Grade</div>', '>FreightLogic Grade</div>')
          old_summary = "if (ev.summary) aiHTML += '<div style=\"font-size:13px;color:var(--text);line-height:1.5;margin-bottom:10px\">' + escapeHtml(ev.summary) + '</div>';"
          new_summary = old_summary + "\n\n        if (ev.agreement === 'CHALLENGE' && ev.challenge) aiHTML += '<div style=\"font-size:12px;color:var(--warn);line-height:1.5;padding:9px 10px;border-radius:8px;background:var(--warn-muted);border:1px solid var(--warn-border);margin-bottom:10px\"><b>AI challenge — recheck:</b> ' + escapeHtml(ev.challenge) + '</div>';"
          if app.count(old_summary) != 1:
              raise SystemExit(f'app.js: AI summary guarded match count {app.count(old_summary)}')
          app = app.replace(old_summary, new_summary, 1)
          old_bid = "if (ev.bidAdvice) aiHTML += '<div style=\"font-size:12px;color:var(--text-secondary);line-height:1.5;padding:10px;border-radius:8px;background:var(--surface-2);margin-bottom:8px\"><b style=\"color:var(--text)\">Bid:</b> ' + escapeHtml(ev.bidAdvice) + '</div>';"
          new_bid = "if (ev.bidAdvice) aiHTML += '<div style=\"font-size:12px;color:var(--text-secondary);line-height:1.5;padding:10px;border-radius:8px;background:var(--surface-2);margin-bottom:8px\"><b style=\"color:var(--text)\">Canonical bid:</b> ' + escapeHtml(ev.bidAdvice) + '</div>';\n        if (ev.bidTactic) aiHTML += '<div style=\"font-size:12px;color:var(--text-secondary);line-height:1.5;padding:8px 10px;border-radius:8px;background:var(--surface-1);margin-bottom:8px\"><b style=\"color:var(--text)\">AI tactic:</b> ' + escapeHtml(ev.bidTactic) + '</div>';"
          if app.count(old_bid) != 1:
              raise SystemExit(f'app.js: AI bid guarded match count {app.count(old_bid)}')
          app = app.replace(old_bid, new_bid, 1)
          write('app.js', app)

          # -----------------------------------------------------------------
          # Worker — AI is review-only for verdict, grade, economics and bid.
          # -----------------------------------------------------------------
          replace_once('cloud-backup-worker.js',
          """        if (!payload.canonicalDecision?.authority?.verdict || !payload.canonicalDecision?.authority?.grade) {\n          return json({ ok: false, error: 'Canonical client decision required for AI review. Local evaluation remains authoritative.' }, 400, cors);\n        }""",
          """        if (!payload.canonicalDecision?.authority?.verdict || !payload.canonicalDecision?.authority?.grade ||\n            !Number.isFinite(Number(payload.canonicalDecision?.economics?.trueRPM)) || !payload.canonicalDecision?.bid?.range) {\n          return json({ ok: false, error: 'Canonical client decision, economics, and bid range are required for AI review. Local evaluation remains authoritative.' }, 400, cors);\n        }""")

          replace_once('cloud-backup-worker.js',
          """            // v24: compatibility fields are projected FROM client authority, never AI-owned.\n            verdict:       canonicalVerdictToAi(payload.canonicalDecision?.authority?.verdict),\n            grade:         canonicalGrade(payload.canonicalDecision?.authority?.grade),\n            authority:     'CLIENT_UNIFIED_DECISION_ENGINE',\n            agreement:     String(parsed.agreement || 'AGREE').toUpperCase() === 'CHALLENGE' ? 'CHALLENGE' : 'AGREE',\n            challenge:     String(parsed.challenge || '').slice(0, 300),\n            trueRpmBand:   String(parsed.trueRpmBand   || '').slice(0, 80),\n            bidAdvice:     String(parsed.bidAdvice      || '').slice(0, 300),\n            primaryReason: String(parsed.primaryReason || '').slice(0, 200),""",
          """            // v24: authority/economics/bid fields are projected FROM the client decision, never AI-owned.\n            verdict:       canonicalVerdict(payload.canonicalDecision?.authority?.verdict),\n            grade:         canonicalGrade(payload.canonicalDecision?.authority?.grade),\n            authority:     'CLIENT_UNIFIED_DECISION_ENGINE',\n            agreement:     String(parsed.agreement || 'AGREE').toUpperCase() === 'CHALLENGE' ? 'CHALLENGE' : 'AGREE',\n            challenge:     String(parsed.challenge || '').slice(0, 300),\n            trueRpmBand:   canonicalTrueRpmLabel(payload.canonicalDecision),\n            bidAdvice:     canonicalBidAdvice(payload.canonicalDecision?.bid),\n            bidTactic:     String(parsed.bidTactic || '').slice(0, 240),\n            primaryReason: String(parsed.primaryReason || '').slice(0, 200),""")

          replace_once('cloud-backup-worker.js',
          """The client-supplied canonical decision is authoritative for verdict and grade. Your job is to explain it, identify risks, and challenge weak assumptions — never independently recalculate or override the authoritative verdict/grade.""",
          """The client-supplied canonical decision is authoritative for verdict, grade, economics, and bid range. Your job is to explain it, identify risks, and challenge weak assumptions — never independently recalculate or override those authoritative fields.""")
          replace_once('cloud-backup-worker.js',
          """- The canonical client decision's verdict and grade are facts for this review, not fields you may replace.\n- If you disagree, set agreement to CHALLENGE and explain the exact assumption/data that should be rechecked.\n- Never manufacture a second authoritative verdict or grade.""",
          """- The canonical client decision's verdict, grade, True RPM, and bid range are facts for this review, not fields you may replace.\n- If you disagree, set agreement to CHALLENGE and explain the exact assumption/data that should be rechecked.\n- Never manufacture a second authoritative verdict, grade, RPM band, or dollar bid.\n- You may suggest a negotiation tactic, but it must stay inside the supplied canonical bid range and must not introduce a new dollar target.""")
          replace_once('cloud-backup-worker.js',
          """  \"trueRpmBand\": \"$X.XX – $X.XX / true mile\",\n  \"bidAdvice\": \"specific dollar target and negotiation tactic (e.g. 'Counter at $1,850 — that gets you to $1.72 true RPM on 1,075 total miles')\",""",
          """  \"bidTactic\": \"negotiation tactic only, with no new dollar or RPM target outside the supplied canonical range\",""")

          replace_once('cloud-backup-worker.js',
          """    field('authoritative_reason', promptField(p.canonicalDecision?.authority?.reason || 'missing', 200)),\n    field('decision_schema', promptField(p.canonicalDecision?.schemaVersion || 'missing', 20)),""",
          """    field('authoritative_reason', promptField(p.canonicalDecision?.authority?.reason || 'missing', 200)),\n    field('authoritative_true_rpm', promptNum(p.canonicalDecision?.economics?.trueRPM)),\n    field('authoritative_bid_minimum', promptField(JSON.stringify(p.canonicalDecision?.bid?.range?.minimum || null), 120)),\n    field('authoritative_bid_professional', promptField(JSON.stringify(p.canonicalDecision?.bid?.range?.professional || null), 120)),\n    field('authoritative_bid_strong', promptField(JSON.stringify(p.canonicalDecision?.bid?.range?.strong || null), 120)),\n    field('authoritative_bid_premium', promptField(JSON.stringify(p.canonicalDecision?.bid?.range?.premium || null), 120)),\n    field('decision_schema', promptField(p.canonicalDecision?.schemaVersion || 'missing', 20)),""")

          replace_once('cloud-backup-worker.js',
          """function canonicalVerdictToAi(v){\n  const s = String(v || '').toUpperCase();\n  if (s === 'ACCEPT') return 'ACCEPT';\n  if (s === 'STRATEGIC' || s === 'DZ-EXIT') return 'STRATEGIC_ONLY';\n  return 'PASS';\n}\nfunction canonicalGrade(g){\n  const s = String(g || '').toUpperCase().trim();\n  return /^[A-E]$/.test(s) ? s : 'C';\n}\n""",
          """function canonicalVerdict(v){\n  const s = String(v || '').toUpperCase().trim();\n  return new Set(['ACCEPT','REJECT','STRATEGIC','DZ-EXIT']).has(s) ? s : 'REJECT';\n}\nfunction canonicalGrade(g){\n  const s = String(g || '').toUpperCase().trim();\n  return /^[A-F]$/.test(s) ? s : 'F';\n}\nfunction canonicalTrueRpmLabel(decision){\n  const rpm = Number(decision?.economics?.trueRPM);\n  return Number.isFinite(rpm) ? `$${rpm.toFixed(2)} / true mile` : '';\n}\nfunction canonicalBidAdvice(bid){\n  const range = bid?.range;\n  if (!range) return 'Use the canonical FreightLogic bid range shown in the local decision.';\n  const fmt = (label, tier) => {\n    const amount = Number(tier?.amount), rpm = Number(tier?.rpm);\n    return Number.isFinite(amount) && Number.isFinite(rpm) ? `${label} $${Math.round(amount)} @ $${rpm.toFixed(2)}/mi` : '';\n  };\n  return [\n    fmt('Minimum', range.minimum),\n    fmt('Professional', range.professional),\n    fmt('Strong', range.strong),\n    fmt('Premium', range.premium),\n  ].filter(Boolean).join(' • ');\n}\n""")

          worker = read('cloud-backup-worker.js')
          if not worker.startswith('// FreightLogic Cloud Backup Worker v11'):
              raise SystemExit('cloud-backup-worker.js: unexpected Worker header')
          worker = worker.replace('// FreightLogic Cloud Backup Worker v11', '// FreightLogic Cloud Backup Worker v12', 1)
          if "return json({ ok: true, version: '11', ts:" not in worker:
              raise SystemExit('cloud-backup-worker.js: health version marker missing')
          worker = worker.replace("return json({ ok: true, version: '11', ts:", "return json({ ok: true, version: '12', ts:", 1)
          write('cloud-backup-worker.js', worker)

          # -----------------------------------------------------------------
          # Regression contracts for the authority gap found during review.
          # -----------------------------------------------------------------
          test = read('tests/unit/v24-unified-decision.spec.mjs')
          test = test.replace(
              "ok(worker.includes('canonicalVerdictToAi(payload.canonicalDecision?.authority?.verdict)'), 'Worker compatibility verdict must project client authority');",
              "ok(worker.includes('canonicalVerdict(payload.canonicalDecision?.authority?.verdict)'), 'Worker verdict must project exact client authority');")
          test = test.replace(
              "ok(worker.includes('canonicalGrade(payload.canonicalDecision?.authority?.grade)'), 'Worker compatibility grade must project client authority');",
              "ok(worker.includes('canonicalGrade(payload.canonicalDecision?.authority?.grade)'), 'Worker grade must project client authority, including F rejects');")
          test = test.replace(
              "ok(worker.includes('Canonical client decision required for AI review'), 'Worker must fail closed when client authority is absent');",
              "ok(worker.includes('Canonical client decision, economics, and bid range are required for AI review'), 'Worker must fail closed when canonical authority/economics/bid are absent');")
          marker = "  ok(!worker.includes('grade:         validateGrade(parsed.grade)'), 'AI-parsed grade must not remain authoritative');\n"
          insert = marker + "  ok(worker.includes('bidAdvice:     canonicalBidAdvice(payload.canonicalDecision?.bid)'), 'Worker bidAdvice must project the canonical client bid range');\n  ok(worker.includes('trueRpmBand:   canonicalTrueRpmLabel(payload.canonicalDecision)'), 'Worker True RPM display must project canonical economics');\n  ok(worker.includes('return /^[A-F]$/.test(s) ? s : \'F\';'), 'Worker canonical grade projection must preserve F rejects');\n  ok(!worker.includes('String(parsed.bidAdvice'), 'AI must not be able to publish a competing dollar bid');\n  ok(!worker.includes('String(parsed.trueRpmBand'), 'AI must not be able to publish a competing RPM band');\n"
          if marker not in test:
              raise SystemExit('v24 test marker missing')
          test = test.replace(marker, insert, 1)
          marker2 = "  ok(app.includes('canonicalDecision: unifiedDecisionForAI(d?._canonicalDecision)'), 'AI payload must carry canonical client decision');\n"
          insert2 = marker2 + "  ok(app.includes('authority: decision.bid.authority'), 'AI projection must include canonical bid authority');\n  ok(app.includes('range: decision.bid.range'), 'AI projection must include canonical bid range');\n"
          if marker2 not in test:
              raise SystemExit('v24 AI payload test marker missing')
          test = test.replace(marker2, insert2, 1)
          write('tests/unit/v24-unified-decision.spec.mjs', test)

          econ_test = read('tests/integration/v24-economics-bid.spec.mjs')
          marker3 = """test('[V24-C06] urgency and border premiums are deterministic and urgency is capped', async () => {\n  const urgent = await bid(100, { urgencyBoost: 0.20, crossBorder: true });\n  eq(urgent.range.minimum.rpm, 1.70, '$1.40 + $0.20 urgency + $0.10 border');\n  const capped = await bid(100, { urgencyBoost: 0.99, crossBorder: false });\n  eq(capped.range.minimum.rpm, 1.70, 'urgency premium caps at $0.30');\n  eq(capped.urgencyBoost, 0.30, 'canonical metadata records capped urgency');\n});\n"""
          replacement3 = marker3 + """\ntest('[V24-C07] invalid or negative urgency can never reduce the protective bid floor', async () => {\n  const negative = await bid(100, { urgencyBoost: -0.50, crossBorder: false });\n  eq(negative.range.minimum.rpm, 1.40, 'negative urgency must clamp to zero, not discount the floor');\n  eq(negative.urgencyBoost, 0, 'canonical urgency metadata must clamp negative values to zero');\n});\n"""
          if econ_test.count(marker3) != 1:
              raise SystemExit('v24 economics test marker missing')
          write('tests/integration/v24-economics-bid.spec.mjs', econ_test.replace(marker3, replacement3, 1))

          # -----------------------------------------------------------------
          # Mark v24.0 complete and bump shipped app/cache parity in one release.
          # -----------------------------------------------------------------
          roadmap = read('docs/V24_ROADMAP.md')
          old_line = "1. **v24.0 Unified Decision Engine** — one deterministic result object inside `app.js`. **In progress:** canonical result contract + grade authority + legacy-render adapter + Worker AI authority separation are complete; Phase B moved the full geography/RPM/long-haul/margin/deadhead/weekly/fatigue/personal hard-gate chain into `deriveUnifiedAuthority()` with boundary tests. Phase C moves economics + bid ownership into pure canonical functions and makes evaluator fuel economics honor the actual `fuelPrice`/`vehicleMpg` settings used elsewhere in FreightLogic."
          new_line = "1. **v24.0 Unified Decision Engine — COMPLETE.** One deterministic client-owned result object inside `app.js` now owns hard-gate verdict, grade, economics, and bid range. USA scoring is evidence-only; the Midwest overlay is advisory; Worker `/evaluate` is review-only and must project canonical verdict/grade/True RPM/bid fields instead of recalculating them. Boundary, determinism, economics, bid, and authority-regression tests enforce the contract."
          if roadmap.count(old_line) != 1:
              raise SystemExit('roadmap v24 line did not match expected in-progress state')
          write('docs/V24_ROADMAP.md', roadmap.replace(old_line, new_line, 1))

          claude = read('CLAUDE.md')
          if '**FreightLogic v23.9.1**' not in claude:
              raise SystemExit('CLAUDE.md current version marker missing')
          claude = claude.replace('**FreightLogic v23.9.1**', '**FreightLogic v24.0.0**', 1)
          overview_anchor = "**No build system.** No npm, no bundler, no transpiler. Everything ships as flat files.\n"
          overview_add = overview_anchor + "\n**v24.0 authority rule:** `app.js` is the sole deterministic owner of load verdict, grade, economics, and bid range. USA scoring and `midwest-stack-authority.js` are evidence/advisory layers. Cloud Worker `/evaluate` may explain or challenge assumptions, but it must project—not recalculate—the canonical decision.\n"
          if claude.count(overview_anchor) != 1:
              raise SystemExit('CLAUDE.md overview anchor missing')
          write('CLAUDE.md', claude.replace(overview_anchor, overview_add, 1))

          version_files = [
              'app.js', 'index.html', 'manifest.json', 'service-worker.js',
              'midwest-stack-authority.js', 'sw-bridge.js', 'voice-load.js',
              'scripts/verify-cloudflare-parity.mjs',
          ]
          for path in version_files:
              text = read(path)
              count = text.count('23.9.1')
              if count == 0:
                  raise SystemExit(f'{path}: expected at least one shipped 23.9.1 marker')
              write(path, text.replace('23.9.1', '24.0.0'))

          parity = read('scripts/verify-cloudflare-parity.mjs')
          if 'workerVersion: "11"' not in parity:
              raise SystemExit('parity worker v11 marker missing')
          parity = parity.replace('workerVersion: "11"', 'workerVersion: "12"', 1)
          parity = parity.replace("Worker reports v11", "Worker reports v12", 1)
          write('scripts/verify-cloudflare-parity.mjs', parity)

          # One-shot workflow removes itself from the final branch.
          Path('.github/workflows/v24-release-authority-patch.yml').unlink()
          PY

          node --check app.js
          node --check cloud-backup-worker.js
          git diff --check

      - name: Commit release correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: complete v24.0 unified decision authority"
          git push origin HEAD:chatgpt/v24-unified-decision-engine
